<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1,
                 viewport-fit=cover,
                 user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#000000"
    >

    <meta
        name="robots"
        content="noindex,nofollow"
    >

    <title>Glazok — Clean Output</title>

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js">
    </script>

    <style>
        :root {
            background: #000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #000;
        }

        body {
            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        /*
         * ОСНОВНОЙ ВИДЕОПОТОК
         *
         * OBS / vMix видит только эту область.
         */

        #video {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            display: block;

            background: #000;

            object-fit: contain;

            border: 0;
            outline: 0;
        }

        /*
         * Служебный статус.
         *
         * Он нужен только во время подключения.
         * После получения видео полностью исчезает.
         */

        #status {
            position: fixed;

            top: 50%;
            left: 50%;

            z-index: 10;

            transform: translate(-50%, -50%);

            padding: 10px 16px;

            color: #777;

            background: rgba(0, 0, 0, 0.75);

            border-radius: 8px;

            font-family:
                Arial,
                sans-serif;

            font-size: 14px;
            line-height: 1.4;

            white-space: nowrap;

            pointer-events: none;

            opacity: 1;

            transition:
                opacity .2s ease,
                visibility .2s ease;
        }

        #status.hidden {
            opacity: 0;
            visibility: hidden;
        }

        /*
         * Скрытая статистика.
         *
         * Не отображается на экране.
         * Используется view.js для контроля:
         *
         * - разрешения
         * - FPS
         * - bitrate
         * - RTT
         * - packet loss
         */

        #stats {
            position: fixed;

            width: 1px;
            height: 1px;

            overflow: hidden;

            opacity: 0;

            pointer-events: none;
        }
    </style>
</head>

<body>

    <video
        id="video"
        autoplay
        playsinline
        muted
        disablepictureinpicture
        disableremoteplayback
    ></video>

    <div
        id="status"
        aria-hidden="true"
    >
        Подключение...
    </div>

    <div
        id="stats"
        aria-hidden="true"
    ></div>

    <script src="./view.js"></script>

</body>
</html>
