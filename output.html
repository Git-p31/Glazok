<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glazok Output — OBS/vMix</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<style>
  :root { --bg:#000; --accent:#ff6b4a; --text:#f5f5f7; --muted:#8e8e98; --mono:'IBM Plex Mono',monospace; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:100%; height:100%; overflow:hidden; background:var(--bg); font-family:var(--mono); }
  .output-screen { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#000; }
  .output-grid { width:100%; height:100%; display:grid; gap:2px; background:#000; }
  .output-grid.g-1 { grid-template:1fr/1fr; }
  .output-grid.g-2 { grid-template:1fr/1fr 1fr; }
  .output-grid.g-3, .output-grid.g-4 { grid-template:1fr 1fr/1fr 1fr; }
  .output-grid video { width:100%; height:100%; object-fit:contain; background:#000; }
  .video-box { position:relative; display:flex; align-items:center; justify-content:center; background:#000; overflow:hidden; }
  .video-box .empty { color:var(--muted); font-size:14px; text-align:center; }
  .output-overlay { position:fixed; bottom:20px; left:20px; font-family:var(--mono); font-size:11px; color:var(--muted); background:rgba(0,0,0,0.7); padding:10px 16px; border-radius:8px; pointer-events:none; opacity:0; transition:opacity 0.3s; max-width:400px; }
  .output-screen:hover .output-overlay { opacity:1; }
  .output-overlay .title { color:var(--accent); font-weight:600; margin-bottom:6px; font-size:12px; }
  .output-overlay .stat { margin:2px 0; }
  .output-overlay .stat b { color:var(--text); }
  .loading { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; color:var(--muted); font-size:14px; }
  .loading .spinner { width:40px; height:40px; border:3px solid rgba(255,255,255,0.1); border-top-color:var(--accent); border-radius:50%; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .error { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; color:#ff4b4b; font-size:14px; text-align:center; padding:20px; }
  .error .code { color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<div class="output-screen" id="output-screen">
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div>Подключение к студии...</div>
  </div>
  <div class="output-grid g-1" id="output-grid" style="display:none"></div>
  <div class="output-overlay" id="overlay">
    <div class="title">GLAZOK OUTPUT</div>
    <div class="stat">Комната: <b id="stat-room">—</b></div>
    <div class="stat">Камеры: <b id="stat-cams">0</b></div>
    <div class="stat">Режим: <b id="stat-mode">—</b></div>
    <div class="stat">Статус: <b id="stat-status">Подключение...</b></div>
  </div>
</div>

<script>
/* GLAZOK OUTPUT — чистый видеовыход для OBS/vMix */
const $ = id => document.getElementById(id);
const log = (...a) => console.log('%c[Output]', 'color:#ff6b4a;font-weight:bold', ...a);
const err = (...a) => console.error('%c[Output!]', 'color:#ff4b4b;font-weight:bold', ...a);

const params = new URLSearchParams(location.search);
const room = params.get('room');
const camParam = params.get('cam');
const mode = params.get('mode') || 'single';
const transparent = params.get('transparent') === '1';

const state = {
  peer: null, room: room, connections: new Map(),
  targetCam: camParam === 'all' ? null : camParam,
  viewMode: mode, stats: new Map()
};

const PEER_CFG = {
  config: {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
      { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
      { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
    ]
  },
  debug: 0
};

if (transparent) document.body.style.background = 'transparent';

function init() {
  if (!room) { showError('Параметр room не указан', 'Добавьте ?room=CODE к URL'); return; }
  $('stat-room').textContent = room.toUpperCase();
  $('stat-mode').textContent = mode === 'grid' ? 'Сетка' : 'Одна камера';
  
  const peerId = 'output-' + Math.random().toString(36).substr(2, 8);
  state.peer = new Peer(peerId, PEER_CFG);
  
  state.peer.on('open', () => {
    log('Output peer открыт:', peerId);
    const monitorId = 'glz-' + room.toLowerCase();
    const conn = state.peer.connect(monitorId, { reliable: true });
    
    conn.on('open', () => {
      log('Подключено к монитору');
      $('stat-status').textContent = 'Подключено';
      conn.send({ type: 'OUTPUT_JOIN', mode: mode });
      conn.on('data', handleMessage);
    });
    
    conn.on('close', () => {
      log('Соединение закрыто');
      $('stat-status').textContent = 'Отключено';
      setTimeout(() => location.reload(), 5000);
    });
    
    conn.on('error', (e) => {
      err('Connection error:', e);
      $('stat-status').textContent = 'Ошибка: ' + e.type;
    });
    
    state.peer.on('call', (call) => {
      log('Входящий звонок от:', call.peer);
      call.answer();
      call.on('stream', (stream) => {
        log('Получен поток');
        addVideoStream(call.peer, stream);
      });
      call.on('close', () => { log('Звонок закрыт'); removeVideoStream(call.peer); });
      call.on('error', (e) => err('Call error:', e));
    });
  });
  
  state.peer.on('error', (e) => {
    err('Peer error:', e);
    $('stat-status').textContent = 'Ошибка: ' + e.type;
    if (e.type === 'peer-unavailable') showError('Студия недоступна', 'Проверьте, что монитор запущен');
  });
}

function handleMessage(d) {
  log('Сообщение:', d.type);
  if (d.type === 'CAM_LIST') updateCamList(d.cams);
  if (d.type === 'CAM_ADDED') $('stat-cams').textContent = d.count;
  if (d.type === 'CAM_REMOVED') { removeVideoStream(d.camId); $('stat-cams').textContent = d.count; }
}

function addVideoStream(camId, stream) {
  const grid = $('output-grid');
  let box = grid.querySelector(`[data-cam="${camId}"]`);
  if (!box) {
    box = document.createElement('div');
    box.className = 'video-box';
    box.dataset.cam = camId;
    const video = document.createElement('video');
    video.autoplay = true; video.playsInline = true; video.muted = true;
    video.srcObject = stream;
    video.onloadeddata = () => log('Видео загружено:', camId);
    box.appendChild(video);
    grid.appendChild(box);
    state.connections.set(camId, { stream, video, box });
    updateGrid();
    $('loading').style.display = 'none';
    grid.style.display = 'grid';
  } else {
    const video = box.querySelector('video');
    video.srcObject = stream;
    state.connections.get(camId).stream = stream;
  }
  $('stat-cams').textContent = state.connections.size;
}

function removeVideoStream(camId) {
  const entry = state.connections.get(camId);
  if (entry) {
    entry.box.remove();
    state.connections.delete(camId);
    if (state.connections.size === 0) {
      $('loading').style.display = 'flex';
      $('output-grid').style.display = 'none';
    } else { updateGrid(); }
  }
  $('stat-cams').textContent = state.connections.size;
}

function updateCamList(cams) { log('Список камер:', cams); }

function updateGrid() {
  const grid = $('output-grid');
  const count = state.connections.size;
  if (state.viewMode === 'grid') {
    grid.className = 'output-grid g-' + Math.min(count, 4);
  } else {
    grid.className = 'output-grid g-1';
    const entries = [...state.connections.entries()];
    entries.forEach(([camId, entry], index) => {
      if (state.targetCam) entry.box.style.display = camId === state.targetCam ? 'flex' : 'none';
      else entry.box.style.display = index === 0 ? 'flex' : 'none';
    });
  }
}

function showError(title, message) {
  const errorDiv = document.createElement('div');
  errorDiv.className = 'error';
  errorDiv.innerHTML = `<div>${title}</div><div class="code">${message}</div>`;
  document.body.appendChild(errorDiv);
  $('loading').style.display = 'none';
}

init();

document.addEventListener('keydown', (e) => {
  if (e.key === 'g' || e.key === 'G' || e.key === 'п' || e.key === 'П') {
    state.viewMode = state.viewMode === 'grid' ? 'single' : 'grid';
    updateGrid(); log('Режим:', state.viewMode);
  }
  if (e.key === 'i' || e.key === 'I' || e.key === 'ш' || e.key === 'Ш') {
    const overlay = $('overlay');
    overlay.style.opacity = overlay.style.opacity === '1' ? '0' : '1';
  }
  if (e.key >= '1' && e.key <= '4') {
    const index = parseInt(e.key) - 1;
    const entries = [...state.connections.entries()];
    if (entries[index]) {
      state.targetCam = entries[index][0];
      state.viewMode = 'single';
      updateGrid(); log('Выбрана камера:', state.targetCam);
    }
  }
});
</script>
</body>
</html>
