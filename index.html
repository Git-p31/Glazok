<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#050508">
    <title>Glazok Studio</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icon.svg">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>

    <style>
        :root {
            --bg: #050508;
            --surface: rgba(255,255,255,.055);
            --surface-strong: rgba(15,15,22,.92);
            --border: rgba(255,255,255,.10);
            --text: #f8fafc;
            --muted: #788195;
            --accent: #6366f1;
            --green: #10b981;
            --red: #ef4444;
            --yellow: #f59e0b;
            --radius: 18px;
            --pill: 999px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, Arial, sans-serif;
        }

        button, input, select {
            font: inherit;
            color: inherit;
            border: 0;
            outline: 0;
        }

        button { cursor: pointer; }

        .screen {
            position: fixed;
            inset: 0;
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .screen.active { display: flex; }

        /* START SCREEN */
        #screen-start {
            padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)) 24px;
            background: radial-gradient(700px circle at 50% 10%, rgba(99,102,241,.18), transparent 70%), var(--bg);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 32px;
        }

        .logo-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 20px rgba(99,102,241,.8);
        }

        .logo-name {
            font-size: 28px;
            font-weight: 700;
        }

        .modes {
            width: min(100%, 360px);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .mode {
            width: 100%;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            text-align: left;
            transition: transform .15s ease, background .15s ease, border-color .15s ease;
        }

        .mode:hover {
            background: rgba(255,255,255,.08);
            border-color: rgba(255,255,255,.16);
        }

        .mode:active { transform: scale(.98); }

        .mode-icon {
            width: 44px;
            height: 44px;
            flex: 0 0 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            background: rgba(99,102,241,.15);
            font-size: 21px;
        }

        .mode-title { font-size: 15px; font-weight: 700; }
        .mode-description { margin-top: 4px; color: var(--muted); font-size: 12px; line-height: 1.4; }

        /* CAMERA CONNECT */
        #screen-camera { background: #000; }

        #camera-connect {
            width: min(calc(100% - 40px), 390px);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .connect-title { margin-bottom: 4px; font-size: 25px; font-weight: 700; text-align: center; }
        .connect-description { margin-bottom: 12px; color: var(--muted); font-size: 13px; line-height: 1.5; text-align: center; }

        .code-input {
            width: 100%;
            height: 64px;
            padding: 0 20px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--surface);
            color: #fff;
            font-family: monospace;
            font-size: 26px;
            font-weight: 700;
            text-align: center;
            letter-spacing: .18em;
            text-transform: uppercase;
        }

        .code-input::placeholder { color: #4b5563; }

        .quality-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .field { display: flex; flex-direction: column; gap: 7px; }
        .field-label { padding-left: 4px; color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }

        .select {
            width: 100%;
            height: 50px;
            padding: 0 14px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: var(--surface-strong);
            color: var(--text);
            font-size: 14px;
            font-weight: 700;
        }

        .select option { background: #111; color: #fff; }

        .adaptive-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 14px 16px;
            border: 1px solid rgba(99,102,241,.25);
            border-radius: 14px;
            background: rgba(99,102,241,.08);
        }

        .adaptive-text strong { display: block; font-size: 13px; }
        .adaptive-text span { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; line-height: 1.35; }

        .switch { position: relative; width: 44px; height: 26px; flex: 0 0 44px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; inset: 0; border-radius: 999px; background: #30303a; transition: .2s; }
        .slider::before { content: ""; position: absolute; width: 20px; height: 20px; left: 3px; top: 3px; border-radius: 50%; background: #fff; transition: .2s; }
        .switch input:checked + .slider { background: var(--accent); }
        .switch input:checked + .slider::before { transform: translateX(18px); }

        .btn {
            width: 100%;
            min-height: 52px;
            padding: 0 20px;
            border-radius: var(--pill);
            background: #fff;
            color: #000;
            font-size: 14px;
            font-weight: 700;
            transition: opacity .15s ease, transform .15s ease;
        }

        .btn:active { transform: scale(.98); }
        .btn:disabled { opacity: .5; cursor: default; }
        .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }

        /* CAMERA VIEW */
        #camera-view { position: fixed; inset: 0; display: none; background: #000; }
        #camera-view.active { display: flex; }

        #camera-video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }

        .camera-ui {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
            pointer-events: none;
        }

        .camera-ui > * { pointer-events: auto; }
        .top-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 38px;
            padding: 0 13px;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: var(--pill);
            background: rgba(8,8,12,.72);
            backdrop-filter: blur(20px);
            color: #fff;
            font-size: 12px;
            font-weight: 700;
        }

        .stats { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
        .dot { width: 8px; height: 8px; flex: 0 0 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); }
        .dot.warning { background: var(--yellow); box-shadow: 0 0 10px var(--yellow); }
        .dot.bad { background: var(--red); box-shadow: 0 0 10px var(--red); }

        .bottom { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }

        .action {
            min-height: 46px;
            padding: 0 16px;
            border-radius: var(--pill);
            background: rgba(8,8,12,.78);
            color: #fff;
            border: 1px solid rgba(255,255,255,.12);
            backdrop-filter: blur(20px);
            font-size: 12px;
            font-weight: 700;
        }

        .action:active { transform: scale(.97); }
        .stop { background: var(--red); border-color: transparent; }

        /* TOAST */
        #toast-container {
            position: fixed;
            left: 50%;
            bottom: calc(80px + env(safe-area-inset-bottom));
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }

        .toast {
            padding: 11px 16px;
            border-radius: var(--pill);
            background: rgba(15,15,20,.94);
            border: 1px solid var(--border);
            color: #fff;
            font-size: 12px;
            white-space: nowrap;
        }
    
/* QR SCANNER */
.divider { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
#scanner { position: fixed; inset: 0; z-index: 200; display: none; align-items: center; justify-content: center; background: #000; overflow: hidden; }
#scanner.active { display: flex; }
#scan-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.scan-frame { position: relative; width: min(70vw, 300px); aspect-ratio: 1; border: 3px solid rgba(255,255,255,.92); border-radius: 24px; box-shadow: 0 0 0 100vmax rgba(0,0,0,.55); }
.scan-hint { position: absolute; left: 0; right: 0; bottom: calc(112px + env(safe-area-inset-bottom)); padding: 0 24px; color: #fff; font-size: 14px; text-align: center; }
.scan-close { position: absolute; left: 50%; bottom: calc(36px + env(safe-area-inset-bottom)); width: min(70%, 260px); transform: translateX(-50%); background: rgba(8,8,12,.82); }
.scan-close:active { transform: translateX(-50%) scale(.98); }

/* ZOOM */
#camera-video { touch-action: none; }
.bottom-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.zoom-panel { width: min(100%, 420px); gap: 12px; }
.zoom-panel[hidden] { display: none; }
.zoom-panel input[type=range] { flex: 1; min-width: 0; height: 28px; accent-color: #6366f1; background: transparent; }
.zoom-label { min-width: 42px; text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>

<body>

<section id="screen-start" class="screen active">
    <div class="logo">
        <span class="logo-dot"></span>
        <span class="logo-name">Glazok</span>
    </div>

    <div class="modes">
        <button class="mode" data-mode="camera">
            <div class="mode-icon">📱</div>
            <div>
                <div class="mode-title">Камера</div>
                <div class="mode-description">Использовать телефон как беспроводную камеру</div>
            </div>
        </button>

        <button class="mode" data-mode="monitor">
            <div class="mode-icon">🖥️</div>
            <div>
                <div class="mode-title">Монитор</div>
                <div class="mode-description">Создать комнату на компьютере</div>
            </div>
        </button>
    </div>
</section>

<section id="screen-camera" class="screen">
    <div id="camera-connect">
        <div class="connect-title">Подключить камеру</div>
        <div class="connect-description">Отсканируйте QR-код на мониторе или введите код комнаты вручную.</div>

        <button id="scan-btn" class="btn" type="button">📷 Сканировать QR-код</button>

<div class="divider">или введите код</div>

<input id="connection-code" class="code-input" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text" placeholder="ABC123">

        <div class="quality-row">
            <div class="field">
                <div class="field-label">Разрешение</div>
                <select id="res-select" class="select">
                    <option value="480">480p</option>
                    <option value="720">720p HD</option>
                    <option value="1080" selected>1080p Full HD</option>
                    <option value="1440">1440p 2K</option>
                    <option value="2160">2160p 4K</option>
                </select>
            </div>

            <div class="field">
                <div class="field-label">Частота</div>
                <select id="fps-select" class="select">
                    <option value="30">30 FPS</option>
                    <option value="60" selected>60 FPS</option>
                    <option value="120">120 FPS</option>
                    <option value="240">240 FPS</option>
                </select>
            </div>
        </div>

        <div class="adaptive-box">
            <div class="adaptive-text">
                <strong>Adaptive Quality</strong>
                <span>Автоматически снижает нагрузку при плохом интернете</span>
            </div>
            <label class="switch">
                <input id="adaptive-toggle" type="checkbox" checked>
                <span class="slider"></span>
            </label>
        </div>

        <button id="connect-btn" class="btn">Подключить камеру</button>
        <button id="back-btn" class="btn btn-secondary">Назад</button>
    </div>

    <div id="camera-view">
        <video id="camera-video" autoplay playsinline muted></video>

        <div class="camera-ui">
            <div class="top-row">
                <div class="pill">
                    <span id="status-dot" class="dot warning"></span>
                    <span id="status-text">CONNECTING</span>
                </div>

                <div class="stats">
                    <div class="pill"><span id="quality-info">—</span></div>
                    <div class="pill"><span id="network-info">—</span></div>
                </div>
            </div>

            <div class="bottom-wrap">

<div id="zoom-panel" class="pill zoom-panel" hidden>

<span>🔍</span>

<input id="zoom-range" type="range" min="1" max="1" step="0.1" value="1" aria-label="Зум">

<span id="zoom-label" class="zoom-label">1.0×</span>

</div>

<div class="bottom">
                <button id="torch-btn" class="action" type="button">Вспышка</button>
                <button id="flip-btn" class="action" type="button">Камера</button>
                <button id="stop-btn" class="action stop" type="button">Стоп</button>
            </div>

</div>
        </div>
    </div>
</section>

<div id="scanner">

<video id="scan-video" autoplay playsinline muted></video>

<div class="scan-frame"></div>

<div class="scan-hint">Наведите камеру на QR-код на мониторе</div>

<button id="scan-close" class="btn btn-secondary scan-close" type="button">Отмена</button>

</div>

<div id="toast-container"></div>

<script>
"use strict";

const $ = id => document.getElementById(id);

const startScreen = $("screen-start");
const cameraScreen = $("screen-camera");
const cameraConnect = $("camera-connect");
const cameraView = $("camera-view");
const cameraVideo = $("camera-video");
const connectionCode = $("connection-code");
const resSelect = $("res-select");
const fpsSelect = $("fps-select");
const adaptiveToggle = $("adaptive-toggle");
const statusDot = $("status-dot");
const statusText = $("status-text");
const qualityInfo = $("quality-info");
const networkInfo = $("network-info");
const connectButton = $("connect-btn");
const scannerEl = $("scanner");
const scanVideo = $("scan-video");
const zoomPanel = $("zoom-panel");
const zoomRange = $("zoom-range");
const zoomLabel = $("zoom-label");

const CODE_RE = /^[a-z0-9]{6}$/i;
const MAX_REDIALS = 12;

const state = {
  peer: null,
  call: null,
  ctrl: null,
  stream: null,
  videoTrack: null,
  facingMode: "environment",
  torchOn: false,
  room: null,
  statsTimer: null,
  adaptiveTimer: null,
  redialTimer: null,
  dropTimer: null,
  wakeLock: null,
  currentLevel: 0,
  maxLevel: 0,
  fpsCap: 60,
  connected: false,
  stopping: false,
  starting: false,
  switching: false,
  retry: 0,
  badStreak: 0,
  goodStreak: 0,
  prevLoss: null,
  zoom: null
};

const PEER_CONFIG = {
  config: {
    iceServers: [
      { urls: "stun:stun.relay.metered.ca:80" },
      { urls: "turn:standard.relay.metered.ca:80", username: "35162de63b0eb72fbb27f4e3", credential: "ZbW2aJl3WmRUyOss" },
      { urls: "turn:standard.relay.metered.ca:80?transport=tcp", username: "35162de63b0eb72fbb27f4e3", credential: "ZbW2aJl3WmRUyOss" },
      { urls: "turn:standard.relay.metered.ca:443", username: "35162de63b0eb72fbb27f4e3", credential: "ZbW2aJl3WmRUyOss" },
      { urls: "turns:standard.relay.metered.ca:443?transport=tcp", username: "35162de63b0eb72fbb27f4e3", credential: "ZbW2aJl3WmRUyOss" }
    ],
    sdpSemantics: "unified-plan"
  }
};

/* Лестница качества. height — короткая сторона кадра. */
const LEVELS = [
  { name: "480p30",  height: 480,  fps: 30, bitrate: 900000 },
  { name: "720p30",  height: 720,  fps: 30, bitrate: 1800000 },
  { name: "720p60",  height: 720,  fps: 60, bitrate: 3000000 },
  { name: "1080p30", height: 1080, fps: 30, bitrate: 4500000 },
  { name: "1080p60", height: 1080, fps: 60, bitrate: 7000000 },
  { name: "1440p30", height: 1440, fps: 30, bitrate: 9000000 },
  { name: "1440p60", height: 1440, fps: 60, bitrate: 13000000 },
  { name: "2160p30", height: 2160, fps: 30, bitrate: 18000000 },
  { name: "2160p60", height: 2160, fps: 60, bitrate: 25000000 }
];

function levelIndex(height, fps) {
  const f = fps >= 60 ? 60 : 30;
  let best = 0;
  LEVELS.forEach((l, i) => { if (l.height <= height && l.fps <= f) best = i; });
  return best;
}

const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

function toast(message) {
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = message;
  $("toast-container").appendChild(el);
  setTimeout(() => el.remove(), 2800);
}

function setStatus(text, type = "ok") {
  statusText.textContent = text;
  statusDot.className = "dot";
  if (type === "warning") statusDot.classList.add("warning");
  if (type === "bad") statusDot.classList.add("bad");
}

function describeError(error) {
  switch (error && error.name) {
    case "NotAllowedError":
    case "SecurityError": return "Нет доступа к камере — разрешите её в настройках браузера";
    case "NotFoundError":
    case "OverconstrainedError": return "Камера не найдена";
    case "NotReadableError": return "Камера занята другим приложением";
    case "NotSupportedError": return "Нужен HTTPS и современный браузер";
    default: return "Не удалось запустить камеру";
  }
}

/* ---------- QR ---------- */

function parseRoom(text) {
  if (!text) return null;
  text = String(text).trim();
  try {
    const url = new URL(text);
    const r = url.searchParams.get("room");
    if (r && CODE_RE.test(r)) return r.toUpperCase();
  } catch {}
  return CODE_RE.test(text) ? text.toUpperCase() : null;
}

const scanner = { active: false, stream: null, timer: 0, detector: null, canvas: null };

async function openScanner() {
  if (scanner.active) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    toast("Сканер недоступен: нужен HTTPS");
    return;
  }
  scannerEl.classList.add("active");
  try {
    scanner.stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }
    });
  } catch (error) {
    scannerEl.classList.remove("active");
    toast(describeError(error));
    return;
  }
  scanVideo.srcObject = scanner.stream;
  await scanVideo.play().catch(() => {});
  if ("BarcodeDetector" in window) {
    try { scanner.detector = new BarcodeDetector({ formats: ["qr_code"] }); } catch { scanner.detector = null; }
  }
  scanner.canvas = scanner.canvas || document.createElement("canvas");
  scanner.active = true;
  scanLoop();
}

function closeScanner() {
  scanner.active = false;
  clearTimeout(scanner.timer);
  if (scanner.stream) {
    scanner.stream.getTracks().forEach(t => { try { t.stop(); } catch {} });
    scanner.stream = null;
  }
  scanVideo.srcObject = null;
  scannerEl.classList.remove("active");
}

async function scanLoop() {
  if (!scanner.active) return;
  let value = null;
  if (scanVideo.readyState >= 2 && scanVideo.videoWidth) {
    try {
      if (scanner.detector) {
        const found = await scanner.detector.detect(scanVideo);
        if (found.length) value = found[0].rawValue;
      } else if (window.jsQR) {
        const scale = Math.min(1, 720 / scanVideo.videoWidth);
        const w = Math.round(scanVideo.videoWidth * scale);
        const h = Math.round(scanVideo.videoHeight * scale);
        scanner.canvas.width = w;
        scanner.canvas.height = h;
        const ctx = scanner.canvas.getContext("2d", { willReadFrequently: true });
        ctx.drawImage(scanVideo, 0, 0, w, h);
        const img = ctx.getImageData(0, 0, w, h);
        const code = window.jsQR(img.data, w, h, { inversionAttempts: "dontInvert" });
        if (code) value = code.data;
      }
    } catch {}
  }
  if (!scanner.active) return;
  const room = parseRoom(value);
  if (room) {
    closeScanner();
    connectionCode.value = room;
    toast("QR распознан");
    connectCamera();
    return;
  }
  scanner.timer = setTimeout(scanLoop, 120);
}

/* ---------- Камера ---------- */

function buildConstraints(levelIdx) {
  const l = LEVELS[levelIdx];
  return {
    audio: false,
    video: {
      facingMode: { ideal: state.facingMode },
      width: { ideal: Math.round(l.height * 16 / 9) },
      height: { ideal: l.height },
      frameRate: { ideal: l.fps }
    }
  };
}

async function openStream(levelIdx) {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    const e = new Error("mediaDevices unavailable");
    e.name = "NotSupportedError";
    throw e;
  }
  const attempts = [
    buildConstraints(levelIdx),
    buildConstraints(Math.min(levelIdx, 1)),
    { audio: false, video: { facingMode: { ideal: state.facingMode } } },
    { audio: false, video: true }
  ];
  let lastError;
  for (const constraints of attempts) {
    try {
      return await navigator.mediaDevices.getUserMedia(constraints);
    } catch (error) {
      lastError = error;
      if (["NotAllowedError", "SecurityError", "NotReadableError"].includes(error.name)) break;
    }
  }
  throw lastError;
}

function stopStream() {
  if (state.stream) {
    state.stream.getTracks().forEach(track => {
      track.onended = null;
      try { track.stop(); } catch {}
    });
    state.stream = null;
  }
  state.videoTrack = null;
  state.torchOn = false;
}

function useStream(stream) {
  state.stream = stream;
  const track = stream.getVideoTracks()[0];
  state.videoTrack = track;
  if (track && "contentHint" in track) track.contentHint = "motion";
  if (track) track.onended = onTrackEnded;
  cameraVideo.srcObject = stream;
  cameraVideo.play().catch(() => {});

  const sender = getVideoSender();
  if (sender && track) sender.replaceTrack(track).catch(error => console.warn("replaceTrack:", error));

  $("torch-btn").textContent = "Вспышка";
  setupZoom();
  setTimeout(() => {
    capLevelToCapture();
    updateLocalQuality();
    applyEncoding(state.currentLevel);
  }, 400);
}

/* Если телефон не дал выбранное разрешение — не обещаем лишнего. */
function capLevelToCapture() {
  if (!state.videoTrack) return;
  const s = state.videoTrack.getSettings();
  if (!s.width || !s.height) return;
  const shortSide = Math.min(s.width, s.height);
  const cap = levelIndex(shortSide + 8, state.fpsCap);
  if (cap < state.maxLevel) state.maxLevel = cap;
  if (state.currentLevel > state.maxLevel) state.currentLevel = state.maxLevel;
}

async function swapCamera() {
  stopStream(); // сначала освобождаем камеру — на Android две сразу не открываются
  const stream = await openStream(state.maxLevel);
  useStream(stream);
}

function onTrackEnded() {
  if (state.stopping || state.switching) return;
  state.switching = true;
  setStatus("ВОССТАНОВЛЕНИЕ КАМЕРЫ", "warning");
  setTimeout(async () => {
    try {
      await swapCamera();
      if (state.connected) setStatus("LIVE"); else setStatus("ПОДКЛЮЧЕНИЕ…", "warning");
    } catch (error) {
      console.error("Camera recover failed:", error);
      setStatus("КАМЕРА НЕДОСТУПНА", "bad");
      toast(describeError(error));
    } finally {
      state.switching = false;
    }
  }, 800);
}

function updateLocalQuality() {
  if (!state.videoTrack) return;
  const settings = state.videoTrack.getSettings();
  const w = cameraVideo.videoWidth || settings.width || 0;
  const h = cameraVideo.videoHeight || settings.height || 0;
  const fps = settings.frameRate || 0;
  if (w && h) qualityInfo.textContent = `${w}×${h} • ${Math.round(fps)} FPS • ${LEVELS[state.currentLevel].name}`;
}

async function requestWakeLock() {
  try {
    if ("wakeLock" in navigator && !state.wakeLock) {
      state.wakeLock = await navigator.wakeLock.request("screen");
      state.wakeLock.addEventListener("release", () => { state.wakeLock = null; });
    }
  } catch {}
}

function releaseWakeLock() {
  if (state.wakeLock) { try { state.wakeLock.release(); } catch {} state.wakeLock = null; }
}

/* ---------- Зум ---------- */

function showZoom() {
  const z = state.zoom;
  zoomLabel.textContent = z ? z.value.toFixed(1) + "×" : "";
  if (z) zoomRange.value = z.value;
}

function setupZoom() {
  let caps = null;
  try { caps = state.videoTrack && state.videoTrack.getCapabilities ? state.videoTrack.getCapabilities() : null; } catch {}
  if (caps && caps.zoom && caps.zoom.max > caps.zoom.min) {
    const s = state.videoTrack.getSettings();
    state.zoom = {
      min: caps.zoom.min,
      max: caps.zoom.max,
      step: caps.zoom.step || 0.1,
      value: s.zoom || caps.zoom.min
    };
    zoomRange.min = state.zoom.min;
    zoomRange.max = state.zoom.max;
    zoomRange.step = state.zoom.step;
    zoomPanel.hidden = false;
    showZoom();
  } else {
    state.zoom = null;
    zoomPanel.hidden = true;
  }
  sendCaps();
}

let zoomPending = null;
let zoomBusy = false;

async function setZoom(value) {
  const z = state.zoom;
  if (!z || !state.videoTrack) return;
  zoomPending = clamp(value, z.min, z.max);
  if (zoomBusy) return;
  zoomBusy = true;
  while (zoomPending !== null) {
    const v = zoomPending;
    zoomPending = null;
    try {
      await state.videoTrack.applyConstraints({ advanced: [{ zoom: v }] });
      z.value = v;
    } catch (error) {
      console.warn("zoom failed:", error);
      toast("Зум недоступен");
      break;
    }
  }
  zoomBusy = false;
  showZoom();
  sendCtrl({ type: "zoom-value", value: z.value });
}

/* ---------- Канал управления с монитором ---------- */

function sendCtrl(message) {
  if (state.ctrl && state.ctrl.open) {
    try { state.ctrl.send(message); } catch {}
  }
}

function sendCaps() {
  sendCtrl({ type: "caps", zoom: state.zoom ? { min: state.zoom.min, max: state.zoom.max, step: state.zoom.step, value: state.zoom.value } : null });
}

function openControl() {
  if (state.ctrl) { try { state.ctrl.close(); } catch {} state.ctrl = null; }
  if (!state.peer || state.peer.destroyed || state.peer.disconnected) return;
  const conn = state.peer.connect("glz-" + state.room, { reliable: true });
  state.ctrl = conn;
  conn.on("open", sendCaps);
  conn.on("data", data => {
    if (data && data.type === "zoom" && typeof data.value === "number") setZoom(data.value);
  });
  conn.on("close", () => { if (state.ctrl === conn) state.ctrl = null; });
  conn.on("error", () => {});
}

/* ---------- Подключение ---------- */

async function connectCamera() {
  const code = parseRoom(connectionCode.value);
  if (!code) {
    toast("Код должен содержать 6 символов");
    return;
  }
  if (state.starting) return;
  state.starting = true;
  connectButton.disabled = true;

  state.room = code.toLowerCase();
  state.stopping = false;
  state.retry = 0;
  state.fpsCap = Number(fpsSelect.value) >= 60 ? 60 : 30;
  state.maxLevel = levelIndex(Number(resSelect.value), state.fpsCap);
  state.currentLevel = state.maxLevel;

  try {
    setStatus("КАМЕРА", "warning");
    const stream = await openStream(state.maxLevel);
    cameraConnect.style.display = "none";
    cameraView.classList.add("active");
    useStream(stream);
    requestWakeLock();
    createPeer();
  } catch (error) {
    console.error("Camera start error:", error);
    stopStream();
    setStatus("КАМЕРА НЕДОСТУПНА", "bad");
    toast(describeError(error));
    connectButton.disabled = false;
  } finally {
    state.starting = false;
  }
}

function destroyPeer() {
  closeCall();
  if (state.ctrl) { try { state.ctrl.close(); } catch {} state.ctrl = null; }
  if (state.peer) {
    const p = state.peer;
    state.peer = null;
    try { p.destroy(); } catch {}
  }
}

function createPeer() {
  destroyPeer();
  const peer = new Peer(undefined, PEER_CONFIG);
  state.peer = peer;

  peer.on("open", () => {
    if (state.peer !== peer || state.stopping) return;
    if (!state.connected) makeCall();
  });

  peer.on("disconnected", () => {
    if (state.peer !== peer || state.stopping) return;
    setTimeout(() => {
      if (state.peer === peer && !peer.destroyed && peer.disconnected) {
        try { peer.reconnect(); } catch { scheduleRedial(true); }
      }
    }, 1000);
  });

  peer.on("error", error => {
    if (state.peer !== peer || state.stopping) return;
    console.warn("PeerJS error:", error.type, error);
    if (error.type === "peer-unavailable") {
      setStatus("ЖДЁМ МОНИТОР", "warning");
      scheduleRedial(false);
    } else if (error.type === "browser-incompatible") {
      setStatus("БРАУЗЕР НЕ ПОДДЕРЖИВАЕТСЯ", "bad");
    } else {
      setStatus("ПЕРЕПОДКЛЮЧЕНИЕ…", "warning");
      scheduleRedial(true);
    }
  });
}

function closeCall() {
  clearTimeout(state.dropTimer);
  stopAdaptiveMonitoring();
  const call = state.call;
  state.call = null;
  state.connected = false;
  if (call) { try { call.close(); } catch {} }
}

function scheduleRedial(recreatePeer) {
  if (state.stopping) return;
  clearTimeout(state.redialTimer);
  if (state.retry >= MAX_REDIALS) {
    setStatus("МОНИТОР НЕ НАЙДЕН", "bad");
    toast("Проверьте код комнаты и что монитор открыт");
    return;
  }
  state.retry++;
  const delay = Math.min(1000 * state.retry, 5000);
  state.redialTimer = setTimeout(() => {
    if (state.stopping) return;
    const p = state.peer;
    if (recreatePeer || !p || p.destroyed) createPeer();
    else if (p.disconnected) { try { p.reconnect(); } catch { createPeer(); } }
    else makeCall();
  }, delay);
}

function makeCall() {
  const peer = state.peer;
  if (!peer || peer.destroyed || !state.stream || state.stopping) return;
  if (peer.disconnected) { try { peer.reconnect(); } catch {} return; }

  closeCall();
  const call = peer.call("glz-" + state.room, state.stream);
  if (!call) {
    setStatus("ЗВОНОК НЕ СОЗДАН", "bad");
    scheduleRedial(true);
    return;
  }
  state.call = call;
  setStatus("ПОДКЛЮЧЕНИЕ…", "warning");

  call.on("stream", () => { if (state.call === call) markLive(); });
  call.on("close", () => {
    if (state.call !== call || state.stopping) return;
    state.connected = false;
    stopAdaptiveMonitoring();
    setStatus("ПЕРЕПОДКЛЮЧЕНИЕ…", "warning");
    scheduleRedial(false);
  });
  call.on("error", error => {
    console.warn("Call error:", error);
    if (state.call !== call || state.stopping) return;
    state.connected = false;
    scheduleRedial(false);
  });

  openControl();
  watchConnection(call);
}

function markLive() {
  if (!state.connected) { state.connected = true; state.retry = 0; }
  setStatus("LIVE");
  if (!state.statsTimer) startAdaptiveMonitoring();
}

/* Монитор отвечает без видео, поэтому событие "stream" у камеры не приходит —
   состояние берём напрямую из RTCPeerConnection. */
function watchConnection(call) {
  let tries = 0;
  const timer = setInterval(() => {
    tries++;
    const pc = call.peerConnection;
    if (pc) {
      clearInterval(timer);
      if (state.call === call) attachPc(call, pc);
    } else if (tries > 50) {
      clearInterval(timer);
    }
  }, 100);
}

function attachPc(call, pc) {
  configureSender();
  const onState = () => {
    if (state.call !== call || state.stopping) return;
    const s = pc.connectionState || pc.iceConnectionState;
    clearTimeout(state.dropTimer);
    if (s === "connected" || s === "completed") {
      markLive();
    } else if (s === "disconnected") {
      state.connected = false;
      setStatus("СВЯЗЬ НЕСТАБИЛЬНА", "warning");
      state.dropTimer = setTimeout(() => {
        if (state.call === call && !state.connected) scheduleRedial(false);
      }, 6000);
    } else if (s === "failed" || s === "closed") {
      state.connected = false;
      stopAdaptiveMonitoring();
      setStatus("ПЕРЕПОДКЛЮЧЕНИЕ…", "warning");
      scheduleRedial(false);
    }
  };
  pc.addEventListener("connectionstatechange", onState);
  pc.addEventListener("iceconnectionstatechange", onState);
  onState();
}

function getVideoSender() {
  const pc = state.call && state.call.peerConnection;
  if (!pc) return null;
  return pc.getSenders().find(s => s.track && s.track.kind === "video") || null;
}

/* ---------- Кодирование и адаптация ---------- */

async function applyEncoding(levelIndexValue) {
  const sender = getVideoSender();
  if (!sender) return false;
  const level = LEVELS[levelIndexValue];
  const parameters = sender.getParameters();
  if (!parameters.encodings || !parameters.encodings.length) parameters.encodings = [{}];
  const encoding = parameters.encodings[0];
  encoding.maxBitrate = level.bitrate;
  encoding.maxFramerate = level.fps;

  const s = state.videoTrack ? state.videoTrack.getSettings() : {};
  if (s.width && s.height) {
    encoding.scaleResolutionDownBy = Math.max(1, Math.min(s.width, s.height) / level.height);
  }
  parameters.degradationPreference = "balanced";

  try {
    await sender.setParameters(parameters);
    return true;
  } catch (error) {
    console.debug("setParameters failed:", error);
    return false;
  }
}

function configureSender() {
  applyEncoding(state.currentLevel);
  updateLocalQuality();
}

function startAdaptiveMonitoring() {
  stopAdaptiveMonitoring();
  state.prevLoss = null;
  state.badStreak = 0;
  state.goodStreak = 0;
  state.statsTimer = setInterval(updateNetworkDisplay, 2000);
  state.adaptiveTimer = setInterval(evaluateNetwork, 4000);
  updateNetworkDisplay();
}

function stopAdaptiveMonitoring() {
  if (state.statsTimer) { clearInterval(state.statsTimer); state.statsTimer = null; }
  if (state.adaptiveTimer) { clearInterval(state.adaptiveTimer); state.adaptiveTimer = null; }
}

async function readStats() {
  const pc = state.call && state.call.peerConnection;
  if (!pc) return null;
  const out = { availableBitrate: null, rtt: null, outbound: null, remoteInbound: null };
  try {
    const reports = await pc.getStats();
    reports.forEach(r => {
      if (r.type === "candidate-pair" && (r.state === "succeeded" || r.nominated)) {
        if (typeof r.availableOutgoingBitrate === "number") out.availableBitrate = r.availableOutgoingBitrate;
        if (typeof r.currentRoundTripTime === "number") out.rtt = r.currentRoundTripTime;
      }
      if (r.type === "outbound-rtp" && r.kind === "video") out.outbound = r;
      if (r.type === "remote-inbound-rtp" && r.kind === "video") out.remoteInbound = r;
    });
  } catch { return null; }
  return out;
}

async function updateNetworkDisplay() {
  const s = await readStats();
  if (s && s.availableBitrate !== null) networkInfo.textContent = formatBitrate(s.availableBitrate);
}

async function evaluateNetwork() {
  if (!adaptiveToggle.checked || !state.connected) return;
  const s = await readStats();
  if (!s) return;
  if (s.availableBitrate !== null) networkInfo.textContent = formatBitrate(s.availableBitrate);

  const current = LEVELS[state.currentLevel];
  let bad = false;
  let veryBad = false;

  if (s.availableBitrate !== null) {
    if (s.availableBitrate < current.bitrate * 0.65) bad = true;
    if (s.availableBitrate < current.bitrate * 0.40) veryBad = true;
  }
  if (s.rtt !== null) {
    if (s.rtt > 0.40) bad = true;
    if (s.rtt > 0.80) veryBad = true;
  }
  /* Потери считаем за последний интервал, а не за всю сессию. */
  if (s.remoteInbound && s.outbound) {
    const lost = Number(s.remoteInbound.packetsLost || 0);
    const sent = Number(s.outbound.packetsSent || 0);
    if (state.prevLoss) {
      const dSent = sent - state.prevLoss.sent;
      const dLost = lost - state.prevLoss.lost;
      if (dSent > 50) {
        const loss = Math.max(0, dLost) / dSent;
        if (loss > 0.05) bad = true;
        if (loss > 0.12) veryBad = true;
      }
    }
    state.prevLoss = { lost, sent };
  }
  if (s.outbound && s.outbound.qualityLimitationReason === "bandwidth") bad = true;

  if (veryBad) {
    state.badStreak = 0; state.goodStreak = 0;
    setStatus("ПЛОХАЯ СВЯЗЬ", "warning");
    await changeLevel(-1);
    return;
  }
  if (bad) {
    state.goodStreak = 0;
    state.badStreak++;
    if (state.badStreak >= 2) { state.badStreak = 0; await changeLevel(-1); }
    return;
  }
  state.badStreak = 0;
  setStatus("LIVE");

  const roomy = s.availableBitrate !== null && s.availableBitrate > current.bitrate * 1.7 && (s.rtt === null || s.rtt < 0.20);
  if (roomy && state.currentLevel < state.maxLevel) {
    state.goodStreak++;
    if (state.goodStreak >= 3) { state.goodStreak = 0; await changeLevel(+1); }
  } else {
    state.goodStreak = 0;
  }
}

async function changeLevel(delta) {
  const next = clamp(state.currentLevel + delta, 0, state.maxLevel);
  if (next === state.currentLevel) return;
  const old = state.currentLevel;
  state.currentLevel = next;
  const ok = await applyEncoding(next);
  if (!ok) { state.currentLevel = old; return; }
  toast((delta < 0 ? "Адаптация: " : "Качество: ") + LEVELS[next].name);
  updateLocalQuality();
}

function formatBitrate(bitrate) {
  if (bitrate >= 1000000) return (bitrate / 1000000).toFixed(1) + " Mbps";
  return Math.round(bitrate / 1000) + " Kbps";
}

/* ---------- Кнопки ---------- */

async function toggleTorch() {
  if (!state.videoTrack) return;
  try {
    const next = !state.torchOn;
    await state.videoTrack.applyConstraints({ advanced: [{ torch: next }] });
    state.torchOn = next;
    $("torch-btn").textContent = next ? "Выключить" : "Вспышка";
  } catch {
    toast("Вспышка недоступна");
  }
}

async function flipCamera() {
  if (state.switching) return;
  state.switching = true;
  const old = state.facingMode;
  state.facingMode = old === "environment" ? "user" : "environment";
  try {
    await swapCamera();
    toast("Камера переключена");
  } catch (error) {
    console.error("Flip camera error:", error);
    state.facingMode = old;
    try { await swapCamera(); } catch {
      setStatus("КАМЕРА НЕДОСТУПНА", "bad");
    }
    toast("Не удалось переключить камеру");
  } finally {
    state.switching = false;
  }
}

function stopCamera() {
  state.stopping = true;
  clearTimeout(state.redialTimer);
  closeScanner();
  destroyPeer();
  stopStream();
  releaseWakeLock();
  cameraVideo.srcObject = null;
  cameraView.classList.remove("active");
  cameraConnect.style.display = "flex";
  connectButton.disabled = false;
  zoomPanel.hidden = true;
  state.zoom = null;
  networkInfo.textContent = "—";
  qualityInfo.textContent = "—";
  setStatus("CONNECTING", "warning");
}

function showStart() {
  stopCamera();
  cameraScreen.classList.remove("active");
  startScreen.classList.add("active");
}

function openMode(mode) {
  if (mode === "camera") {
    startScreen.classList.remove("active");
    cameraScreen.classList.add("active");
    return;
  }
  if (mode === "monitor") window.location.href = "./monitor.html";
}

document.addEventListener("click", event => {
  const mode = event.target.closest("[data-mode]");
  if (mode) openMode(mode.dataset.mode);
});

connectButton.addEventListener("click", connectCamera);
$("scan-btn").addEventListener("click", openScanner);
$("scan-close").addEventListener("click", closeScanner);
$("back-btn").addEventListener("click", showStart);
$("stop-btn").addEventListener("click", stopCamera);
$("torch-btn").addEventListener("click", toggleTorch);
$("flip-btn").addEventListener("click", flipCamera);
zoomRange.addEventListener("input", () => setZoom(Number(zoomRange.value)));
connectionCode.addEventListener("keydown", event => { if (event.key === "Enter") connectCamera(); });

/* Щипок двумя пальцами */
let pinch = null;
const touchDist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
cameraView.addEventListener("touchstart", e => {
  if (e.touches.length === 2 && state.zoom) pinch = { d: touchDist(e.touches), z: state.zoom.value };
}, { passive: true });
cameraView.addEventListener("touchmove", e => {
  if (pinch && e.touches.length === 2) {
    e.preventDefault();
    setZoom(pinch.z * touchDist(e.touches) / pinch.d);
  }
}, { passive: false });
cameraView.addEventListener("touchend", e => { if (e.touches.length < 2) pinch = null; });

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && state.stream && !state.stopping) {
    requestWakeLock();
    if (!state.connected && state.peer) scheduleRedial(false);
  }
});

window.addEventListener("online", () => {
  if (state.stream && !state.stopping && !state.connected) { state.retry = 0; scheduleRedial(true); }
});

window.addEventListener("DOMContentLoaded", () => {
  const params = new URLSearchParams(window.location.search);
  const mode = params.get("m");
  const room = parseRoom(params.get("room"));

  if (mode === "monitor") {
    window.location.href = "./monitor.html";
    return;
  }
  if (mode === "camera" || room) {
    startScreen.classList.remove("active");
    cameraScreen.classList.add("active");
  }
  if (room) {
    connectionCode.value = room;
    setTimeout(connectCamera, 300); // QR открыл страницу — подключаемся сразу
  }
});

window.addEventListener("beforeunload", () => {
  state.stopping = true;
  stopAdaptiveMonitoring();
  stopStream();
  closeScanner();
  destroyPeer();
});

</script>
</body>
</html>
