<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#050508">
  <meta name="description" content="Glazok Studio — P2P камера для смартфона">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icon.svg">

  <title>Glazok Studio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --bg: #050508;
      --surface: rgba(255, 255, 255, 0.04);
      --surface-border: rgba(255, 255, 255, 0.08);
      --surface-hover: rgba(255, 255, 255, 0.08);

      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.35);

      --danger: #ef4444;
      --ok: #10b981;
      --warning: #f59e0b;

      --text: #f8fafc;
      --muted: #64748b;

      --font-sans: 'Plus Jakarta Sans', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      --r-pill: 9999px;
      --r-xl: 28px;
      --r-lg: 18px;
      --r-md: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }

    button, input, select {
      font: inherit;
      color: inherit;
      border: none;
      outline: none;
    }

    select option {
      background: #0f0f15;
      color: #fff;
    }

    button {
      cursor: pointer;
      user-select: none;
    }

    .app {
      position: relative;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
    }

    .screen {
      position: absolute;
      inset: 0;
      display: none;
    }

    .screen.active {
      display: flex;
    }

    /* =========================
       START SCREEN
    ========================= */
    #screen-select {
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 24px;
      background: 
        radial-gradient(800px circle at 50% -20%, rgba(99, 102, 241, 0.15), transparent 80%),
        var(--bg);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .logo-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    h1 {
      margin-bottom: 12px;
      text-align: center;
      font-size: clamp(32px, 6vw, 56px);
      font-weight: 700;
      letter-spacing: -0.03em;
      background: linear-gradient(180deg, #ffffff 30%, rgba(255,255,255,0.6));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .lead {
      max-width: 440px;
      margin-bottom: 40px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
      text-align: center;
    }

    .modes {
      display: flex;
      flex-direction: column;
      width: min(100%, 380px);
      gap: 12px;
    }

    .mode-card {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 18px 22px;
      border: 1px solid var(--surface-border);
      border-radius: var(--r-lg);
      background: var(--surface);
      backdrop-filter: blur(20px);
      text-align: left;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .mode-card:hover {
      border-color: rgba(255, 255, 255, 0.2);
      background: var(--surface-hover);
      transform: translateY(-2px);
    }

    .mode-card:active {
      transform: translateY(0);
    }

    .mode-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: var(--r-md);
      background: rgba(255, 255, 255, 0.05);
      font-family: var(--font-mono);
      font-size: 18px;
      font-weight: 600;
      color: var(--accent);
    }

    .mode-copy strong {
      display: block;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .mode-copy span {
      color: var(--muted);
      font-size: 13px;
    }

    /* =========================
       MONITOR / STUDIO
    ========================= */
    #screen-monitor {
      width: 100%;
      height: 100%;
    }

    .studio {
      display: flex;
      width: 100%;
      height: 100%;
      background: #000;
    }

    .sidebar {
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 72px;
      padding: 24px 0;
      gap: 12px;
      background: var(--bg);
      border-right: 1px solid var(--surface-border);
      transition: transform 0.3s ease;
    }

    .sb-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: var(--r-md);
      background: transparent;
      color: var(--muted);
      transition: all 0.2s ease;
    }

    .sb-btn:hover {
      background: var(--surface);
      color: var(--text);
    }

    .sb-btn svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .sb-btn.danger {
      margin-top: auto;
      color: var(--danger);
    }

    .stage {
      position: relative;
      flex: 1;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    .stage-top {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: none;
    }

    .stage-top > * {
      pointer-events: auto;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      border: 1px solid var(--surface-border);
      border-radius: var(--r-pill);
      background: rgba(10, 10, 15, 0.75);
      backdrop-filter: blur(24px);
      font-size: 13px;
      font-weight: 500;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
    }

    .status-dot.ok { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
    .status-dot.live { background: var(--danger); box-shadow: 0 0 10px var(--danger); animation: pulse 1.5s infinite; }
    .status-dot.warn { background: var(--warning); box-shadow: 0 0 10px var(--warning); }

    .net-info {
      margin-left: auto;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
    }

    .net-info b { color: var(--text); }

    .video-grid {
      display: grid;
      width: 100%;
      height: 100%;
      gap: 4px;
      background: #000;
      padding: 4px;
    }

    .video-grid.v1 { grid-template-columns: 1fr; }
    .video-grid.v2 { grid-template-columns: 1fr 1fr; }
    .video-grid.v3, .video-grid.v4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }

    .video-box {
      position: relative;
      border-radius: var(--r-md);
      overflow: hidden;
      background: #09090d;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-box video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .video-box video.loaded { opacity: 1; }

    .video-label {
      position: absolute;
      left: 14px;
      bottom: 14px;
      padding: 6px 12px;
      border-radius: var(--r-pill);
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
      font-family: var(--font-mono);
      font-size: 11px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* =========================
       RIGHT PANEL (DRAWER)
    ========================= */
    .right-panel {
      z-index: 25;
      position: absolute;
      top: 16px;
      right: 16px;
      bottom: 16px;
      width: 300px;
      padding: 24px;
      border: 1px solid var(--surface-border);
      border-radius: var(--r-xl);
      background: rgba(10, 10, 15, 0.85);
      backdrop-filter: blur(30px);
      display: flex;
      flex-direction: column;
      gap: 20px;
      transform: translateX(calc(100% + 32px));
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .right-panel.open { transform: translateX(0); }

    .panel-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--muted);
    }

    .control-label b { color: var(--text); font-family: var(--font-mono); }

    input[type="range"] {
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: var(--surface-border);
      accent-color: var(--accent);
      cursor: pointer;
    }

    /* =========================
       BUTTONS & MODALS
    ========================= */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      border: 1px solid var(--surface-border);
      border-radius: var(--r-pill);
      background: var(--surface);
      backdrop-filter: blur(12px);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: var(--surface-hover);
      border-color: rgba(255,255,255,0.2);
    }

    .btn.active, .btn.primary {
      background: #fff;
      color: #000;
      border-color: #fff;
    }

    .btn.danger {
      background: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.2);
      color: var(--danger);
    }

    .btn.full { width: 100%; }

    .qr-modal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 50;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 28px;
      width: min(90vw, 320px);
      border: 1px solid var(--surface-border);
      border-radius: var(--r-xl);
      background: rgba(10, 10, 15, 0.9);
      backdrop-filter: blur(30px);
    }

    .qr-modal.visible { display: flex; }

    .qr-code-text {
      font-family: var(--font-mono);
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: var(--accent);
    }

    .qr-box {
      padding: 12px;
      border-radius: var(--r-lg);
      background: #fff;
    }

    /* =========================
       CAMERA SCREEN & LANDSCAPE
    ========================= */
    #screen-camera {
      position: relative;
      width: 100vw;
      height: 100dvh;
      background: #000;
    }

    .camera-connect {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
    }

    .code-input {
      width: min(100%, 280px);
      margin: 20px 0 12px;
      padding: 16px;
      border: 1px solid var(--surface-border);
      border-radius: var(--r-lg);
      background: var(--surface);
      color: #fff;
      font-family: var(--font-mono);
      font-size: 24px;
      letter-spacing: 0.2em;
      text-align: center;
      text-transform: uppercase;
    }

    .camera-view {
      position: absolute;
      inset: 0;
      display: none;
      width: 100%;
      height: 100%;
    }

    .camera-view.visible { display: block; }

    .camera-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover; /* Заполняет весь экран без черных полей */
    }

    .camera-ui {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
      pointer-events: none;
    }

    .camera-ui > * { pointer-events: auto; }

    .camera-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .camera-bottom {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .camera-controls-pill {
      display: flex;
      gap: 8px;
      padding: 8px;
      border-radius: var(--r-pill);
      background: rgba(10, 10, 15, 0.75);
      backdrop-filter: blur(24px);
      border: 1px solid var(--surface-border);
    }

    .camera-controls-pill select, .camera-controls-pill button {
      flex: 1;
      height: 40px;
      border-radius: var(--r-pill);
      padding: 0 14px;
    }

    /* ГОРИЗОНТАЛЬНЫЙ РЕЖИМ СМАРТФОНА */
    @media (orientation: landscape) {
      .camera-ui {
        flex-direction: row;
      }

      .camera-top {
        flex-direction: column;
        align-items: flex-start;
      }

      .camera-bottom {
        justify-content: flex-end;
        width: 280px;
      }

      .camera-controls-pill {
        flex-direction: column;
        border-radius: var(--r-lg);
      }
    }

    /* =========================
       TOASTS & ZEN
    ========================= */
    .toasts {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      padding: 12px 18px;
      border-radius: var(--r-pill);
      background: rgba(15, 15, 20, 0.9);
      border: 1px solid var(--surface-border);
      backdrop-filter: blur(20px);
      font-size: 13px;
      color: var(--text);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .studio.zen .sidebar, .studio.zen .stage-top {
      opacity: 0;
      pointer-events: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- START -->
  <section id="screen-select" class="screen active">
    <div class="logo">
      <span class="logo-dot"></span>
      Glazok Studio
    </div>

    <h1>Камера без проводов.</h1>
    <p class="lead">Превратите ваш смартфон в профессиональную беспроводную веб-камеру за секунду.</p>

    <div class="modes">
      <button class="mode-card" data-mode="monitor">
        <div class="mode-icon">M</div>
        <div class="mode-copy">
          <strong>Монитор Studio</strong>
          <span>Для компьютера или планшета</span>
        </div>
      </button>

      <button class="mode-card" data-mode="camera">
        <div class="mode-icon">C</div>
        <div class="mode-copy">
          <strong>Камера</strong>
          <span>Использовать этот телефон</span>
        </div>
      </button>

      <button class="mode-card" id="install-button" style="display:none">
        <div class="mode-icon">↓</div>
        <div class="mode-copy">
          <strong>Установить PWA</strong>
          <span>Быстрый доступ с экрана</span>
        </div>
      </button>
    </div>
  </section>

  <!-- MONITOR -->
  <section id="screen-monitor" class="screen">
    <div class="studio" id="studio">
      <aside class="sidebar">
        <div class="logo-dot" style="margin-bottom: 12px;"></div>

        <button class="sb-btn" data-action="qr" title="QR Код">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><path d="M14 14h3v3h-3zM18 18h3v3h-3z"></path></svg>
        </button>

        <button class="sb-btn" data-action="grid" title="Сетка">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"></rect><rect x="13" y="3" width="8" height="8" rx="2"></rect><rect x="3" y="13" width="8" height="8" rx="2"></rect><rect x="13" y="13" width="8" height="8" rx="2"></rect></svg>
        </button>

        <button class="sb-btn" id="panel-toggle" data-action="panel" title="Настройки">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>

        <button class="sb-btn" data-action="zen" title="Скрыть интерфейс">
          <svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>

        <button class="sb-btn danger" data-action="exit" title="Выход">✕</button>
      </aside>

      <main class="stage">
        <div class="stage-top">
          <div class="pill">
            <span class="status-dot" id="monitor-dot"></span>
            <span id="monitor-status">Подключение...</span>
          </div>

          <div id="camera-buttons" style="display:flex; gap:8px;"></div>

          <div class="pill net-info" id="network-info">
            <span>RTT: <b id="latency">—</b>ms</span>
          </div>
        </div>

        <div class="video-grid v1" id="video-grid"></div>

        <div class="qr-modal" id="qr-modal">
          <span style="font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: 0.1em;">КОД ПОДКЛЮЧЕНИЯ</span>
          <div class="qr-code-text" id="room-code">------</div>
          <div class="qr-box" id="qr-box"></div>
          <button class="btn full" data-action="close-qr">Закрыть</button>
        </div>
      </main>

      <aside class="right-panel" id="right-panel-el">
        <div class="panel-title">Коррекция картинки</div>

        <div class="control-group">
          <div class="control-label">Яркость <b id="brightness-value">100</b></div>
          <input type="range" min="50" max="150" value="100" data-control="brightness">
        </div>

        <div class="control-group">
          <div class="control-label">Контраст <b id="contrast-value">100</b></div>
          <input type="range" min="50" max="150" value="100" data-control="contrast">
        </div>

        <div class="control-group">
          <div class="control-label">Насыщенность <b id="saturation-value">100</b></div>
          <input type="range" min="0" max="200" value="100" data-control="saturation">
        </div>

        <div class="panel-title" style="margin-top: 12px;">Управление</div>
        <button class="btn full" data-action="torch">💡 Вспышка</button>
      </aside>
    </div>
  </section>

  <!-- CAMERA -->
  <section id="screen-camera" class="screen">
    <div class="camera-connect" id="camera-connect">
      <button class="btn" data-action="back" style="position: absolute; top: 20px; left: 20px;">← Назад</button>
      <h2 style="font-size: 24px; font-weight: 700;">Ввод кода</h2>
      <input class="code-input" id="connection-code" maxlength="6" placeholder="A1B2C3" autocomplete="off">
      <button class="btn primary full" style="max-width: 280px;" data-action="connect">Подключиться</button>
    </div>

    <div class="camera-view" id="camera-view">
      <video id="camera-video" class="camera-video" autoplay playsinline muted></video>

      <div class="camera-ui">
        <div class="camera-top">
          <div class="pill">
            <span class="status-dot warn" id="camera-dot"></span>
            <span id="camera-status">Подключение...</span>
          </div>

          <button class="btn" data-action="flip-camera">🔄</button>
        </div>

        <div class="camera-bottom">
          <div class="camera-controls-pill">
            <select class="btn" id="quality-select">
              <option value="1080p30">1080p 30 FPS</option>
              <option value="720p30">720p 30 FPS</option>
              <option value="480p30">480p 30 FPS</option>
            </select>

            <button class="btn danger" data-action="stop">⏹ Стоп</button>
          </div>
        </div>
      </div>
    </div>
  </section>

</div>

<div class="toasts" id="toasts"></div>

<script>
  "use strict";

  const $ = id => document.getElementById(id);

  const state = {
    mode: null,
    peer: null,
    room: null,
    stream: null,
    connections: new Map(),
    activeCamera: null,
    viewMode: "auto",
    zen: false,
    facingMode: "environment",
    image: { brightness: 100, contrast: 100, saturation: 100 }
  };

  function toast(message, type = "ok") {
    const el = document.createElement("div");
    el.className = `toast ${type}`;
    el.textContent = message;
    $("toasts").appendChild(el);
    setTimeout(() => el.remove(), 3000);
  }

  function randomCode(length = 6) {
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let res = "";
    for (let i = 0; i < length; i++) res += chars[Math.floor(Math.random() * chars.length)];
    return res;
  }

  const PEER_CONFIG = {
    config: { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] }
  };

  function setMode(mode) {
    teardown();
    state.mode = mode;
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));

    if (mode === "monitor") {
      $("screen-monitor").classList.add("active");
      initMonitor();
    } else if (mode === "camera") {
      $("screen-camera").classList.add("active");
      initCamera();
    } else {
      $("screen-select").classList.add("active");
    }
  }

  function teardown() {
    if (state.peer) state.peer.destroy();
    if (state.stream) state.stream.getTracks().forEach(t => t.stop());
    state.peer = null;
    state.stream = null;
    state.connections.clear();
    $("video-grid").innerHTML = "";
  }

  /* MONITOR LOGIC */
  function initMonitor() {
    state.room = randomCode(6).toLowerCase();
    state.peer = new Peer("glz-" + state.room, PEER_CONFIG);

    state.peer.on("open", () => {
      $("monitor-status").textContent = "Готов";
      $("monitor-dot").className = "status-dot ok";
      $("room-code").textContent = state.room.toUpperCase();
      renderQR();
      $("qr-modal").classList.add("visible");
    });

    state.peer.on("connection", conn => {
      conn.on("open", () => {
        state.connections.set(conn.peer, { conn });
        updateGrid();
      });
    });

    state.peer.on("call", call => {
      call.answer();
      call.on("stream", stream => {
        let entry = state.connections.get(call.peer) || {};
        entry.stream = stream;
        state.connections.set(call.peer, entry);
        $("qr-modal").classList.remove("visible");
        updateGrid();
      });
    });
  }

  function updateGrid() {
    const grid = $("video-grid");
    grid.innerHTML = "";
    const cams = [...state.connections.entries()].filter(([, item]) => item.stream);

    if (!cams.length) {
      grid.className = "video-grid v1";
      grid.innerHTML = `<div class="video-box"><span style="color:var(--muted)">Ожидание подключения камеры...</span></div>`;
      return;
    }

    grid.className = "video-grid v" + Math.min(4, cams.length);
    cams.forEach(([id, item], idx) => {
      const box = document.createElement("div");
      box.className = "video-box";
      const video = document.createElement("video");
      video.autoplay = true;
      video.playsInline = true;
      video.muted = true;
      video.srcObject = item.stream;
      video.onloadeddata = () => video.classList.add("loaded");
      
      const label = document.createElement("div");
      label.className = "video-label";
      label.textContent = "Камера " + (idx + 1);

      box.appendChild(video);
      box.appendChild(label);
      grid.appendChild(box);
    });
  }

  function renderQR() {
    const box = $("qr-box");
    box.innerHTML = "";
    const url = `${location.origin}${location.pathname}?m=camera&room=${state.room}`;
    if (window.QRCode) new QRCode(box, { text: url, width: 140, height: 140 });
  }

  /* CAMERA LOGIC */
  function initCamera() {
    $("camera-connect").style.display = "flex";
    $("camera-view").classList.remove("visible");
  }

  async function connectAsCamera(code) {
    teardown();
    state.peer = new Peer(PEER_CONFIG);

    state.peer.on("open", () => {
      const target = "glz-" + code;
      const conn = state.peer.connect(target);

      conn.on("open", async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: state.facingMode, width: { ideal: 1920 } },
            audio: false
          });
          state.stream = stream;
          $("camera-video").srcObject = stream;
          $("camera-connect").style.display = "none";
          $("camera-view").classList.add("visible");
          state.peer.call(target, stream);
          $("camera-status").textContent = "В эфире";
          $("camera-dot").className = "status-dot live";
        } catch {
          toast("Ошибка доступа к камере", "error");
        }
      });
    });
  }

  /* EVENT LISTENERS */
  document.addEventListener("click", e => {
    const card = e.target.closest("[data-mode]");
    if (card) return setMode(card.dataset.mode);

    const actionBtn = e.target.closest("[data-action]");
    if (actionBtn) {
      const act = actionBtn.dataset.action;
      if (act === "qr") $("qr-modal").classList.add("visible");
      if (act === "close-qr") $("qr-modal").classList.remove("visible");
      if (act === "panel") $("right-panel-el").classList.toggle("open");
      if (act === "zen") {
        state.zen = !state.zen;
        $("studio").classList.toggle("zen", state.zen);
      }
      if (act === "exit" || act === "back" || act === "stop") setMode(null);
      if (act === "connect") {
        const code = $("connection-code").value.trim().toLowerCase();
        if (code) connectAsCamera(code);
      }
      if (act === "flip-camera") {
        state.facingMode = state.facingMode === "user" ? "environment" : "user";
        const code = $("connection-code").value.trim().toLowerCase();
        if (code) connectAsCamera(code);
      }
    }
  });

  document.querySelectorAll("[data-control]").forEach(input => {
    input.addEventListener("input", e => {
      const target = e.target.dataset.control;
      const val = parseFloat(e.target.value);
      state.image[target] = val;
      $(`${target}-value`).textContent = val;
      document.querySelectorAll(".video-box video").forEach(v => {
        v.style.filter = `brightness(${state.image.brightness}%) contrast(${state.image.contrast}%) saturate(${state.image.saturation}%)`;
      });
    });
  });
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .catch(err => console.error('SW registration failed:', err));
    });
  }
</script>

</body>
</html>
