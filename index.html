<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#050508">
  <title>Glazok Studio Ultra HD</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>

  <style>
    :root {
      --bg: #050508;
      --surface: rgba(255, 255, 255, 0.05);
      --surface-border: rgba(255, 255, 255, 0.1);
      --accent: #6366f1;
      --danger: #ef4444;
      --ok: #10b981;
      --text: #f8fafc;
      --muted: #64748b;
      --font-sans: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --r-pill: 9999px;
      --r-lg: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
    }

    button, input {
      font: inherit;
      color: inherit;
      border: none;
      outline: none;
    }

    .screen {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .screen.active { display: flex; }

    /* START SCREEN */
    #screen-select {
      padding: 24px;
      background: radial-gradient(800px circle at 50% 20%, rgba(99, 102, 241, 0.15), transparent 80%), var(--bg);
    }

    h1 {
      font-size: clamp(32px, 5vw, 48px);
      font-weight: 700;
      margin-bottom: 32px;
      text-align: center;
    }

    .modes {
      display: flex;
      flex-direction: column;
      width: min(100%, 320px);
      gap: 12px;
    }

    .mode-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 24px;
      border: 1px solid var(--surface-border);
      border-radius: var(--r-lg);
      background: var(--surface);
      backdrop-filter: blur(20px);
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .mode-card:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
    }

    /* MONITOR SCREEN */
    #screen-monitor {
      background: #000;
      width: 100vw;
      height: 100dvh;
    }

    .monitor-hud {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      border: 1px solid var(--surface-border);
      border-radius: var(--r-pill);
      background: rgba(10, 10, 15, 0.75);
      backdrop-filter: blur(20px);
      font-size: 13px;
      font-weight: 500;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
    }
    .status-dot.ok { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
    .status-dot.live { background: var(--danger); box-shadow: 0 0 10px var(--danger); }

    .room-tag {
      font-family: var(--font-mono);
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.1em;
    }

    .main-video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    /* CAMERA SCREEN */
    #screen-camera { background: #000; }

    .camera-connect {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: min(90%, 320px);
    }

    .code-input {
      width: 100%;
      padding: 16px;
      border: 1px solid var(--surface-border);
      border-radius: var(--r-lg);
      background: var(--surface);
      font-family: var(--font-mono);
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-align: center;
      text-transform: uppercase;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 24px;
      border-radius: var(--r-pill);
      background: #fff;
      color: #000;
      font-size: 14px;
      font-weight: 700;
      width: 100%;
      transition: all 0.2s ease;
    }

    .btn.danger { background: var(--danger); color: #fff; }

    .camera-ui {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
      pointer-events: none;
    }

    .camera-ui > * { pointer-events: auto; }

    .camera-actions {
      display: flex;
      gap: 12px;
    }

    .btn-icon {
      padding: 12px 20px;
      border-radius: var(--r-pill);
      background: rgba(10, 10, 15, 0.75);
      border: 1px solid var(--surface-border);
      backdrop-filter: blur(20px);
      font-size: 13px;
      font-weight: 600;
    }

    .toasts {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      padding: 12px 20px;
      border-radius: var(--r-pill);
      background: rgba(15, 15, 20, 0.9);
      border: 1px solid var(--surface-border);
      font-size: 13px;
    }
  </style>
</head>
<body>

<div class="app">

  <!-- СТАРТОВЫЙ ЭКРАН -->
  <section id="screen-select" class="screen active">
    <h1>Glazok Studio</h1>
    <div class="modes">
      <button class="mode-card" data-mode="monitor">🖥️ Монитор (ПК)</button>
      <button class="mode-card" data-mode="camera">📱 Камера (Телефон)</button>
    </div>
  </section>

  <!-- ЭКРАН МОНИТОРА -->
  <section id="screen-monitor" class="screen">
    <div class="monitor-hud">
      <div class="pill">
        <span class="status-dot" id="monitor-dot"></span>
        <span id="monitor-status">Создание комнаты...</span>
      </div>
      <div class="pill">Код: <b class="room-tag" id="room-code">------</b></div>
      <button class="pill" data-action="exit" style="cursor:pointer">✕ Выйти</button>
    </div>
    <video id="monitor-video" class="main-video" autoplay playsinline muted></video>
  </section>

  <!-- ЭКРАН КАМЕРЫ -->
  <section id="screen-camera" class="screen">
    <div class="camera-connect" id="camera-connect">
      <input class="code-input" id="connection-code" maxlength="6" placeholder="КОД" autocomplete="off">
      <button class="btn" data-action="connect">Подключить (Max Quality)</button>
      <button class="btn-icon" data-action="exit" style="width:100%">← Назад</button>
    </div>

    <div class="screen" id="camera-view" style="display:none;">
      <video id="camera-video" class="main-video" autoplay playsinline muted style="object-fit:cover;"></video>
      <div class="camera-ui">
        <div class="pill">
          <span class="status-dot live"></span>
          <span>В ЭФИРЕ (1 КАМЕРА)</span>
        </div>
        <div class="camera-actions">
          <button class="btn-icon" data-action="torch">💡 Вспышка</button>
          <button class="btn-icon" data-action="flip">🔄 Смена камеры</button>
          <button class="btn danger" data-action="exit">Стоп</button>
        </div>
      </div>
    </div>
  </section>

</div>

<div class="toasts" id="toasts"></div>

<script>
  "use strict";

  const $ = id => document.getElementById(id);
  const state = { 
    mode: null, 
    peer: null, 
    call: null,
    room: null, 
    stream: null, 
    torchOn: false, 
    facingMode: "environment" 
  };

  function toast(msg) {
    const el = document.createElement("div");
    el.className = "toast";
    el.textContent = msg;
    $("toasts").appendChild(el);
    setTimeout(() => el.remove(), 3000);
  }

  function randomCode() {
    return Math.random().toString(36).substring(2, 8);
  }

  const PEER_CONFIG = {
    config: {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" },
        { urls: "stun:stun2.l.google.com:19302" }
      ]
    }
  };

  function setMode(mode) {
    teardown();
    state.mode = mode;
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));

    if (mode === "monitor") {
      $("screen-monitor").classList.add("active");
      initMonitor();
    } else if (mode === "camera") {
      $("screen-camera").classList.add("active");
      initCamera();
    } else {
      $("screen-select").classList.add("active");
    }
  }

  function stopMediaStream() {
    if (state.stream) {
      state.stream.getTracks().forEach(track => {
        track.stop();
      });
      state.stream = null;
    }
    state.torchOn = false;
  }

  function teardown() {
    stopMediaStream();
    if (state.call) { state.call.close(); state.call = null; }
    if (state.peer) { state.peer.destroy(); state.peer = null; }
    
    $("monitor-video").srcObject = null;
    $("camera-video").srcObject = null;
  }

  /* МОНИТОР */
  function initMonitor() {
    state.room = randomCode();
    state.peer = new Peer("glz-" + state.room, PEER_CONFIG);

    state.peer.on("open", () => {
      $("monitor-status").textContent = "Ожидание камеры";
      $("monitor-dot").className = "status-dot ok";
      $("room-code").textContent = state.room.toUpperCase();
    });

    state.peer.on("call", call => {
      // Закрываем предыдущий вызов, если он существовал
      if (state.call) {
        state.call.close();
      }
      state.call = call;

      call.answer();
      call.on("stream", stream => {
        const vid = $("monitor-video");
        vid.srcObject = stream;
        $("monitor-status").textContent = "Трансляция активна";
        $("monitor-dot").className = "status-dot live";
      });

      call.on("close", () => {
        $("monitor-status").textContent = "Камера отключилась";
        $("monitor-dot").className = "status-dot ok";
        $("monitor-video").srcObject = null;
      });
    });
  }

  /* КАМЕРА */
  function initCamera() {
    $("camera-connect").style.display = "flex";
    $("camera-view").style.display = "none";
  }

  async function getCameraStream() {
    stopMediaStream(); // Гарантированно гасим прошлый поток устройства перед запросом нового

    const constraints = {
      audio: false,
      video: {
        facingMode: state.facingMode,
        width: { ideal: 3840, min: 1280 },
        height: { ideal: 2160, min: 720 },
        frameRate: { ideal: 60, min: 24 }
      }
    };

    state.stream = await navigator.mediaDevices.getUserMedia(constraints);
    $("camera-video").srcObject = state.stream;
    return state.stream;
  }

  async function startCameraStream(code) {
    const cleanCode = code.trim().toLowerCase();
    if (!cleanCode) return toast("Введите код!");

    try {
      const newStream = await getCameraStream();

      if (!state.peer || state.peer.destroyed) {
        state.peer = new Peer(PEER_CONFIG);
        
        state.peer.on("open", () => {
          makeCall("glz-" + cleanCode, newStream);
        });

        state.peer.on("error", () => toast("Ошибка соединения"));
      } else {
        makeCall("glz-" + cleanCode, newStream);
      }
    } catch (err) {
      console.error(err);
      toast("Не удалось захватить видео");
    }
  }

  function makeCall(target, stream) {
    if (state.call) {
      state.call.close();
    }

    state.call = state.peer.call(target, stream);

    if (state.call && state.call.peerConnection) {
      const pc = state.call.peerConnection;
      pc.getSenders().forEach(sender => {
        if (sender.track && sender.track.kind === 'video') {
          const params = sender.getParameters();
          if (!params.encodings || params.encodings.length === 0) {
            params.encodings = [{}];
          }
          params.degradationPreference = 'maintain-resolution';
          params.encodings[0].maxBitrate = 30000000;
          sender.setParameters(params).catch(() => {});
        }
      });
    }

    $("camera-connect").style.display = "none";
    $("camera-view").style.display = "flex";
  }

  /* СМЕНА КАМЕРЫ (ПЕРЕВОРОТ) */
  async function flipCamera() {
    state.facingMode = state.facingMode === "user" ? "environment" : "user";
    
    try {
      const newStream = await getCameraStream();
      const newTrack = newStream.getVideoTracks()[0];

      if (state.call && state.call.peerConnection) {
        const sender = state.call.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
        if (sender) {
          // Мгновенно подменяем медиатрек внутри действующего P2P соединения
          await sender.replaceTrack(newTrack);
          toast("Камера переключена");
          return;
        }
      }

      // Пересоздание соединения, если подмена трека недоступна
      const code = $("connection-code").value;
      if (code) startCameraStream(code);

    } catch (e) {
      console.error(e);
      toast("Ошибка переключения");
    }
  }

  /* ВСПЫШКА */
  async function toggleTorch() {
    if (!state.stream) return;
    const track = state.stream.getVideoTracks()[0];
    try {
      state.torchOn = !state.torchOn;
      await track.applyConstraints({ advanced: [{ torch: state.torchOn }] });
    } catch (e) {
      toast("Вспышка недоступна");
    }
  }

  /* СОБЫТИЯ */
  document.addEventListener("click", e => {
    const card = e.target.closest("[data-mode]");
    if (card) return setMode(card.dataset.mode);

    const btn = e.target.closest("[data-action]");
    if (btn) {
      const act = btn.dataset.action;
      if (act === "exit") setMode(null);
      if (act === "connect") startCameraStream($("connection-code").value);
      if (act === "torch") toggleTorch();
      if (act === "flip") flipCamera();
    }
  });

  // Авто-вход по ссылке
  window.addEventListener("DOMContentLoaded", () => {
    const params = new URLSearchParams(window.location.search);
    const room = params.get("room");
    if (room) {
      setMode("camera");
      $("connection-code").value = room.toUpperCase();
      startCameraStream(room);
    }
  });
</script>

</body>
</html>
