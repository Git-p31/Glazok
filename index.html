<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1,
                 viewport-fit=cover,
                 user-scalable=no"
    >

    <meta name="theme-color" content="#050508">

    <title>Glazok Studio</title>

    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icon.svg">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>

    <style>

        :root {
            --bg: #050508;

            --surface:
                rgba(255,255,255,.055);

            --surface-strong:
                rgba(15,15,22,.88);

            --border:
                rgba(255,255,255,.10);

            --text: #f8fafc;

            --muted: #788195;

            --accent: #6366f1;

            --green: #10b981;

            --red: #ef4444;

            --yellow: #f59e0b;

            --radius: 18px;

            --pill: 999px;
        }


        * {
            box-sizing: border-box;

            margin: 0;
            padding: 0;

            -webkit-tap-highlight-color:
                transparent;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: var(--bg);

            color: var(--text);

            font-family:
                Arial,
                sans-serif;
        }


        button,
        input,
        select {

            font: inherit;

            color: inherit;

            border: 0;

            outline: 0;
        }


        button {
            cursor: pointer;
        }


        /* =========================
           SCREENS
        ========================= */

        .screen {

            position: fixed;

            inset: 0;

            display: none;

            width: 100%;
            height: 100%;

            flex-direction: column;

            align-items: center;

            justify-content: center;
        }


        .screen.active {
            display: flex;
        }


        /* =========================
           START
        ========================= */

        #screen-start {

            padding:
                max(24px, env(safe-area-inset-top))
                24px
                max(24px, env(safe-area-inset-bottom))
                24px;

            background:

                radial-gradient(
                    700px circle at 50% 10%,
                    rgba(99,102,241,.18),
                    transparent 70%
                ),

                var(--bg);
        }


        .logo {

            display: flex;

            align-items: center;

            gap: 10px;

            margin-bottom: 32px;
        }


        .logo-dot {

            width: 12px;
            height: 12px;

            border-radius: 50%;

            background: var(--accent);

            box-shadow:
                0 0 20px
                rgba(99,102,241,.8);
        }


        .logo-name {

            font-size: 28px;

            font-weight: 700;
        }


        .modes {

            width: min(
                100%,
                340px
            );

            display: flex;

            flex-direction: column;

            gap: 12px;
        }


        .mode {

            width: 100%;

            padding: 20px;

            display: flex;

            align-items: center;

            gap: 16px;

            border-radius:
                var(--radius);

            border:
                1px solid var(--border);

            background:
                var(--surface);

            text-align: left;

            transition:
                transform .15s ease,
                background .15s ease;
        }


        .mode:active {

            transform:
                scale(.98);
        }


        .mode-icon {

            width: 42px;
            height: 42px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 14px;

            background:
                rgba(99,102,241,.15);

            font-size: 21px;
        }


        .mode-title {

            font-size: 15px;

            font-weight: 700;
        }


        .mode-description {

            margin-top: 4px;

            color: var(--muted);

            font-size: 12px;
        }


        /* =========================
           CAMERA CONNECT
        ========================= */

        #screen-camera {

            background: #000;
        }


        #camera-connect {

            width: min(
                calc(100% - 40px),
                390px
            );

            display: flex;

            flex-direction: column;

            gap: 14px;
        }


        .connect-title {

            margin-bottom: 4px;

            font-size: 25px;

            font-weight: 700;

            text-align: center;
        }


        .connect-description {

            margin-bottom: 12px;

            color: var(--muted);

            font-size: 13px;

            line-height: 1.5;

            text-align: center;
        }


        .code-input {

            width: 100%;

            height: 64px;

            padding: 0 20px;

            border-radius:
                var(--radius);

            border:
                1px solid var(--border);

            background:
                var(--surface);

            font-family:
                "JetBrains Mono",
                monospace;

            font-size: 26px;

            font-weight: 700;

            text-align: center;

            letter-spacing: .18em;

            text-transform: uppercase;
        }


        .quality-row {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 10px;
        }


        .field {

            display: flex;

            flex-direction: column;

            gap: 7px;
        }


        .field-label {

            padding-left: 4px;

            color: var(--muted);

            font-size: 11px;

            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: .08em;
        }


        .select {

            width: 100%;

            height: 50px;

            padding: 0 14px;

            border-radius:
                14px;

            border:
                1px solid var(--border);

            background:
                var(--surface-strong);

            color: var(--text);

            font-size: 14px;

            font-weight: 700;
        }


        .select option {

            background: #111;

            color: #fff;
        }


        .adaptive-box {

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 14px 16px;

            border:
                1px solid
                rgba(99,102,241,.25);

            border-radius:
                14px;

            background:
                rgba(99,102,241,.08);
        }


        .adaptive-text strong {

            display: block;

            font-size: 13px;
        }


        .adaptive-text span {

            display: block;

            margin-top: 3px;

            color: var(--muted);

            font-size: 11px;
        }


        .switch {

            position: relative;

            width: 44px;
            height: 26px;
        }


        .switch input {

            opacity: 0;

            width: 0;
            height: 0;
        }


        .slider {

            position: absolute;

            inset: 0;

            border-radius:
                999px;

            background: #30303a;

            transition:
                .2s;
        }


        .slider::before {

            content: "";

            position: absolute;

            width: 20px;
            height: 20px;

            left: 3px;
            top: 3px;

            border-radius: 50%;

            background: #fff;

            transition:
                .2s;
        }


        .switch input:checked + .slider {

            background:
                var(--accent);
        }


        .switch input:checked + .slider::before {

            transform:
                translateX(18px);
        }


        .btn {

            width: 100%;

            min-height: 52px;

            padding: 0 20px;

            border-radius:
                var(--pill);

            background: #fff;

            color: #000;

            font-size: 14px;

            font-weight: 700;
        }


        .btn-secondary {

            background:
                var(--surface);

            color: var(--text);

            border:
                1px solid var(--border);
        }


        .btn-danger {

            background:
                var(--red);

            color: #fff;
        }


        /* =========================
           CAMERA VIEW
        ========================= */

        #camera-view {

            position: fixed;

            inset: 0;

            display: none;

            background: #000;
        }


        #camera-view.active {

            display: flex;
        }


        #camera-video {

            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            background: #000;
        }


        .camera-ui {

            position: absolute;

            inset: 0;

            z-index: 10;

            display: flex;

            flex-direction: column;

            justify-content: space-between;

            padding:

                max(
                    18px,
                    env(safe-area-inset-top)
                )

                18px

                max(
                    18px,
                    env(safe-area-inset-bottom)
                );

            pointer-events: none;
        }


        .camera-ui > * {

            pointer-events: auto;
        }


        .top-row {

            display: flex;

            align-items: center;

            justify-content: space-between;
        }


        .pill {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            min-height: 38px;

            padding:
                0 13px;

            border:
                1px solid
                rgba(255,255,255,.12);

            border-radius:
                var(--pill);

            background:
                rgba(8,8,12,.72);

            backdrop-filter:
                blur(20px);

            font-size: 12px;

            font-weight: 700;
        }


        .dot {

            width: 8px;
            height: 8px;

            border-radius: 50%;

            background:
                var(--green);

            box-shadow:
                0 0 10px
                var(--green);
        }


        .dot.warning {

            background:
                var(--yellow);

            box-shadow:
                0 0 10px
                var(--yellow);
        }


        .dot.bad {

            background:
                var(--red);

            box-shadow:
                0 0 10px
                var(--red);
        }


        .stats {

            display: flex;

            align-items: center;

            gap: 8px;

            flex-wrap: wrap;

            justify-content: flex-end;
        }


        .bottom {

            display: flex;

            justify-content: center;

            gap: 8px;
        }


        .action {

            min-height: 46px;

            padding:
                0 16px;

            border-radius:
                var(--pill);

            background:
                rgba(8,8,12,.78);

            color: #fff;

            border:
                1px solid
                rgba(255,255,255,.12);

            backdrop-filter:
                blur(20px);

            font-size: 12px;

            font-weight: 700;
        }


        .stop {

            background:
                var(--red);

            border-color:
                transparent;
        }


        /* =========================
           TOAST
        ========================= */

        #toast-container {

            position: fixed;

            left: 50%;

            bottom:
                calc(
                    80px +
                    env(safe-area-inset-bottom)
                );

            transform:
                translateX(-50%);

            z-index: 100;

            display: flex;

            flex-direction: column;

            gap: 8px;

            pointer-events: none;
        }


        .toast {

            padding:
                11px 16px;

            border-radius:
                var(--pill);

            background:
                rgba(15,15,20,.94);

            border:
                1px solid var(--border);

            font-size: 12px;

            white-space: nowrap;
        }

    </style>
</head>

<body>


<!-- =========================
     START
========================= -->

<section
    id="screen-start"
    class="screen active"
>

    <div class="logo">

        <span class="logo-dot"></span>

        <span class="logo-name">
            Glazok
        </span>

    </div>


    <div class="modes">

        <button
            class="mode"
            data-mode="camera"
        >

            <div class="mode-icon">
                📱
            </div>

            <div>

                <div class="mode-title">
                    Камера
                </div>

                <div class="mode-description">
                    Использовать телефон
                    как беспроводную камеру
                </div>

            </div>

        </button>


        <button
            class="mode"
            data-mode="monitor"
        >

            <div class="mode-icon">
                🖥️
            </div>

            <div>

                <div class="mode-title">
                    Монитор
                </div>

                <div class="mode-description">
                    Открыть комнату
                    на компьютере
                </div>

            </div>

        </button>

    </div>

</section>



<!-- =========================
     CAMERA
========================= -->

<section
    id="screen-camera"
    class="screen"
>


    <div
        id="camera-connect"
    >

        <div class="connect-title">
            Подключить камеру
        </div>

        <div class="connect-description">
            Введите код комнаты
            с компьютера.
        </div>


        <input
            id="connection-code"
            class="code-input"
            maxlength="6"
            autocomplete="off"
            autocapitalize="characters"
            placeholder="ABC123"
        >


        <div class="quality-row">


            <div class="field">

                <div class="field-label">
                    Разрешение
                </div>

                <select
                    id="res-select"
                    class="select"
                >

                    <option value="480">
                        480p
                    </option>

                    <option value="720">
                        720p HD
                    </option>

                    <option
                        value="1080"
                        selected
                    >
                        1080p Full HD
                    </option>

                    <option value="1440">
                        1440p 2K
                    </option>

                    <option value="2160">
                        2160p 4K
                    </option>

                </select>

            </div>


            <div class="field">

                <div class="field-label">
                    Частота
                </div>

                <select
                    id="fps-select"
                    class="select"
                >

                    <option value="30">
                        30 FPS
                    </option>

                    <option
                        value="60"
                        selected
                    >
                        60 FPS
                    </option>

                    <option value="120">
                        120 FPS
                    </option>

                    <option value="240">
                        240 FPS
                    </option>

                </select>

            </div>

        </div>


        <div class="adaptive-box">

            <div class="adaptive-text">

                <strong>
                    Adaptive Quality
                </strong>

                <span>
                    Автоматическая адаптация
                    под интернет
                </span>

            </div>


            <label class="switch">

                <input
                    id="adaptive-toggle"
                    type="checkbox"
                    checked
                >

                <span class="slider"></span>

            </label>

        </div>


        <button
            id="connect-btn"
            class="btn"
        >
            Подключить камеру
        </button>


        <button
            id="back-btn"
            class="btn btn-secondary"
        >
            Назад
        </button>

    </div>


    <!-- CAMERA VIEW -->

    <div id="camera-view">


        <video
            id="camera-video"
            autoplay
            playsinline
            muted
        ></video>


        <div class="camera-ui">


            <div class="top-row">


                <div class="pill">

                    <span
                        id="status-dot"
                        class="dot"
                    ></span>

                    <span id="status-text">
                        CONNECTING
                    </span>

                </div>


                <div class="stats">

                    <div class="pill">
                        <span id="quality-info">
                            —
                        </span>
                    </div>

                    <div class="pill">
                        <span id="network-info">
                            —
                        </span>
                    </div>

                </div>

            </div>


            <div class="bottom">


                <button
                    id="torch-btn"
                    class="action"
                >
                    💡 Вспышка
                </button>


                <button
                    id="flip-btn"
                    class="action"
                >
                    🔄 Камера
                </button>


                <button
                    id="stop-btn"
                    class="action stop"
                >
                    Стоп
                </button>

            </div>

        </div>

    </div>

</section>


<div id="toast-container"></div>



<script>

"use strict";


/* =========================================================
   ELEMENTS
========================================================= */

const $ = id =>
    document.getElementById(id);


const startScreen =
    $("screen-start");

const cameraScreen =
    $("screen-camera");

const cameraConnect =
    $("camera-connect");

const cameraView =
    $("camera-view");

const cameraVideo =
    $("camera-video");

const connectionCode =
    $("connection-code");

const resSelect =
    $("res-select");

const fpsSelect =
    $("fps-select");

const adaptiveToggle =
    $("adaptive-toggle");

const statusDot =
    $("status-dot");

const statusText =
    $("status-text");

const qualityInfo =
    $("quality-info");

const networkInfo =
    $("network-info");


/* =========================================================
   STATE
========================================================= */

const state = {

    peer: null,

    call: null,

    stream: null,

    videoTrack: null,

    facingMode: "environment",

    torchOn: false,

    room: null,

    adaptiveTimer: null,

    statsTimer: null,

    lastStats: null,

    currentLevel: 0,

    targetLevel: 0,

    manualResolution: true,

    manualFps: true,

    connected: false
};


/* =========================================================
   CAMERA LEVELS
========================================================= */

const LEVELS = [

    {
        name: "480p30",

        width: 854,
        height: 480,

        fps: 30,

        bitrate: 900000
    },

    {
        name: "720p30",

        width: 1280,
        height: 720,

        fps: 30,

        bitrate: 1800000
    },

    {
        name: "720p60",

        width: 1280,
        height: 720,

        fps: 60,

        bitrate: 3000000
    },

    {
        name: "1080p30",

        width: 1920,
        height: 1080,

        fps: 30,

        bitrate: 4500000
    },

    {
        name: "1080p60",

        width: 1920,
        height: 1080,

        fps: 60,

        bitrate: 7000000
    }

];


/* =========================================================
   USER QUALITY → START LEVEL
========================================================= */

function getInitialLevel() {

    const resolution =
        Number(
            resSelect.value
        );

    const fps =
        Number(
            fpsSelect.value
        );


    if (
        resolution >= 1080 &&
        fps >= 60
    ) {
        return 4;
    }


    if (
        resolution >= 1080
    ) {
        return 3;
    }


    if (
        resolution >= 720 &&
        fps >= 60
    ) {
        return 2;
    }


    if (
        resolution >= 720
    ) {
        return 1;
    }


    return 0;
}


/* =========================================================
   TOAST
========================================================= */

function toast(message) {

    const element =
        document.createElement(
            "div"
        );

    element.className =
        "toast";

    element.textContent =
        message;

    $("toast-container")
        .appendChild(element);


    setTimeout(
        () => element.remove(),
        2800
    );
}


/* =========================================================
   STATUS
========================================================= */

function setStatus(
    text,
    type = "ok"
) {

    statusText.textContent =
        text;


    statusDot.className =
        "dot";


    if (
        type === "warning"
    ) {

        statusDot.classList
            .add("warning");

    }


    if (
        type === "bad"
    ) {

        statusDot.classList
            .add("bad");

    }

}


/* =========================================================
   STOP STREAM
========================================================= */

function stopStream() {

    if (
        state.stream
    ) {

        state.stream
            .getTracks()
            .forEach(track =>
                track.stop()
            );

        state.stream = null;
    }


    state.videoTrack =
        null;


    state.torchOn =
        false;
}


/* =========================================================
   CAMERA CONSTRAINTS
========================================================= */

function getConstraints(
    level
) {

    const quality =
        LEVELS[level];


    return {

        audio: false,

        video: {

            facingMode:
                state.facingMode,

            width: {
                ideal:
                    quality.width
            },

            height: {
                ideal:
                    quality.height
            },

            frameRate: {
                ideal:
                    quality.fps,

                max:
                    quality.fps
            },

            /*
             * Не требуем exact.
             *
             * Это важно:
             * если телефон не умеет
             * 1080p60, браузер сможет
             * выбрать ближайший режим.
             */
        }

    };
}


/* =========================================================
   GET CAMERA
========================================================= */

async function getCameraStream(
    level
) {

    stopStream();


    const constraints =
        getConstraints(
            level
        );


    try {

        state.stream =
            await navigator
                .mediaDevices
                .getUserMedia(
                    constraints
                );

    } catch (error) {

        console.error(
            "Camera error:",
            error
        );


        /*
         * Fallback:
         * если выбранный режим
         * недоступен — пробуем 720p30.
         */

        if (level !== 1) {

            state.stream =
                await navigator
                    .mediaDevices
                    .getUserMedia(
                        getConstraints(1)
                    );

        } else {

            throw error;

        }

    }


    state.videoTrack =
        state.stream
            .getVideoTracks()[0];


    cameraVideo.srcObject =
        state.stream;


    await cameraVideo
        .play()
        .catch(() => {});


    updateLocalQuality();


    return state.stream;
}


/* =========================================================
   REAL CAMERA SETTINGS
========================================================= */

function updateLocalQuality() {

    if (
        !state.videoTrack
    ) {
        return;
    }


    const settings =
        state.videoTrack
            .getSettings();


    const width =
        settings.width || 0;

    const height =
        settings.height || 0;

    const fps =
        settings.frameRate || 0;


    qualityInfo.textContent =
        `${width}×${height} • ${Math.round(fps)} FPS`;

}


/* =========================================================
   CONNECT
========================================================= */

async function connectCamera() {

    const code =
        connectionCode.value
            .trim()
            .toLowerCase();


    if (!code) {

        toast(
            "Введите код комнаты"
        );

        return;
    }


    if (
        !/^[a-z0-9]{6}$/.test(code)
    ) {

        toast(
            "Код должен содержать 6 символов"
        );

        return;
    }


    try {

        $("connect-btn")
            .disabled = true;


        state.room =
            code;


        state.targetLevel =
            getInitialLevel();


        state.currentLevel =
            state.targetLevel;


        /*
         * Получаем камеру ДО создания звонка.
         */

        const stream =
            await getCameraStream(
                state.currentLevel
            );


        /*
         * Создаём Peer.
         */

        state.peer =
            new Peer(
                undefined,
                {
                    config: {

                        iceServers: [

                            {
                                urls:
                                    "stun:stun.l.google.com:19302"
                            },

                            {
                                urls:
                                    "stun:stun1.l.google.com:19302"
                            }

                        ]

                    }
                }
            );


        state.peer.on(
            "open",
            () => {

                makeCall(
                    "glz-" + code,
                    stream
                );

            }
        );


        state.peer.on(
            "error",
            error => {

                console.error(
                    "Peer error:",
                    error
                );


                toast(
                    "Ошибка WebRTC"
                );


                setStatus(
                    "ОШИБКА",
                    "bad"
                );

            }
        );


        state.peer.on(
            "disconnected",
            () => {

                setStatus(
                    "СВЯЗЬ ПОТЕРЯНА",
                    "bad"
                );

            }
        );


    } catch (error) {

        console.error(
            error
        );


        toast(
            "Не удалось запустить камеру"
        );


        $("connect-btn")
            .disabled = false;

    }

}


/* =========================================================
   MAKE CALL
========================================================= */

function makeCall(
    target,
    stream
) {

    if (
        state.call
    ) {

        try {
            state.call.close();
        } catch {}

    }


    state.call =
        state.peer.call(
            target,
            stream
        );


    if (!state.call) {

        toast(
            "Не удалось создать соединение"
        );

        return;
    }


    /*
     * Когда PeerJS создал RTCPeerConnection,
     * применяем параметры отправки.
     */

    waitForPeerConnection();


    state.call.on(
        "close",
        () => {

            state.connected =
                false;

            setStatus(
                "СОЕДИНЕНИЕ ЗАКРЫТО",
                "bad"
            );

            stopAdaptiveMonitoring();

        }
    );


    state.call.on(
        "error",
        error => {

            console.error(
                "Call error:",
                error
            );

            setStatus(
                "ОШИБКА СВЯЗИ",
                "bad"
            );

        }
    );


    /*
     * Интерфейс камеры.
     */

    cameraConnect.style.display =
        "none";

    cameraView.classList
        .add("active");


    setStatus(
        "ПОДКЛЮЧЕНИЕ...",
        "warning"
    );


    startAdaptiveMonitoring();

}


/* =========================================================
   WAIT PEER CONNECTION
========================================================= */

function waitForPeerConnection() {

    let attempts = 0;


    const timer =
        setInterval(
            () => {

                attempts++;


                const pc =
                    state.call &&
                    state.call
                        .peerConnection;


                if (pc) {

                    clearInterval(timer);

                    configureSender();

                    return;
                }


                if (attempts > 100) {

                    clearInterval(timer);

                }

            },
            100
        );

}


/* =========================================================
   CONFIGURE SENDER
========================================================= */

function configureSender() {

    const pc =
        state.call &&
        state.call.peerConnection;


    if (!pc) {
        return;
    }


    const sender =
        pc.getSenders()
            .find(
                item =>
                    item.track &&
                    item.track.kind ===
                    "video"
            );


    if (!sender) {
        return;
    }


    const level =
        LEVELS[
            state.currentLevel
        ];


    const parameters =
        sender.getParameters();


    if (
        !parameters.encodings ||
        !parameters.encodings.length
    ) {

        parameters.encodings = [{}];

    }


    const encoding =
        parameters.encodings[0];


    /*
     * Главный параметр.
     *
     * WebRTC не будет пытаться
     * постоянно держать 40 Mbps.
     */

    encoding.maxBitrate =
        level.bitrate;


    encoding.maxFramerate =
        level.fps;


    /*
     * При плохой сети сначала
     * уменьшаем масштаб, а не
     * полностью ломаем поток.
     */

    parameters.degradationPreference =
        "maintain-resolution";


    sender
        .setParameters(
            parameters
        )
        .catch(
            error =>
                console.debug(
                    "setParameters:",
                    error
                )
        );


    updateLocalQuality();

}


/* =========================================================
   ADAPTIVE MONITORING
========================================================= */

function startAdaptiveMonitoring() {

    stopAdaptiveMonitoring();


    /*
     * Статистика сети.
     */

    state.statsTimer =
        setInterval(
            collectNetworkStats,
            2000
        );


    /*
     * Проверка качества.
     */

    state.adaptiveTimer =
        setInterval(
            evaluateNetwork,
            4000
        );

}


/* =========================================================
   STOP ADAPTIVE
========================================================= */

function stopAdaptiveMonitoring() {

    if (
        state.statsTimer
    ) {

        clearInterval(
            state.statsTimer
        );

        state.statsTimer =
            null;
    }


    if (
        state.adaptiveTimer
    ) {

        clearInterval(
            state.adaptiveTimer
        );

        state.adaptiveTimer =
            null;
    }

}


/* =========================================================
   COLLECT WEBRTC STATS
========================================================= */

async function collectNetworkStats() {

    const pc =
        state.call &&
        state.call.peerConnection;


    if (!pc) {
        return;
    }


    try {

        const reports =
            await pc.getStats();


        let outbound = null;


        reports.forEach(
            report => {

                if (
                    report.type ===
                        "outbound-rtp" &&

                    report.kind ===
                        "video"
                ) {

                    outbound =
                        report;

                }

            }
        );


        if (!outbound) {
            return;
        }


        state.lastStats =
            outbound;


    } catch (error) {

        console.debug(
            "Stats error:",
            error
        );

    }

}


/* =========================================================
   EVALUATE NETWORK
========================================================= */

async function evaluateNetwork() {

    if (
        !adaptiveToggle.checked
    ) {

        return;
    }


    const pc =
        state.call &&
        state.call.peerConnection;


    if (!pc) {
        return;
    }


    let availableBitrate =
        null;

    let packetsLost = 0;

    let packetsSent = 0;

    let roundTripTime =
        null;


    try {

        const reports =
            await pc.getStats();


        reports.forEach(
            report => {

                /*
                 * Исходящая полоса.
                 */

                if (
                    report.type ===
                    "candidate-pair" &&

                    report.state ===
                    "succeeded"
                ) {

                    if (
                        typeof
                        report.availableOutgoingBitrate
                        === "number"
                    ) {

                        availableBitrate =
                            report.availableOutgoingBitrate;

                    }


                    if (
                        typeof
                        report.currentRoundTripTime
                        === "number"
                    ) {

                        roundTripTime =
                            report.currentRoundTripTime;

                    }

                }


                /*
                 * Потери видео.
                 */

                if (
                    report.type ===
                    "outbound-rtp" &&

                    report.kind ===
                    "video"
                ) {

                    packetsLost =
                        report.packetsLost || 0;

                    packetsSent =
                        report.packetsSent || 0;

                }

            });


    } catch {

        return;

    }


    /*
     * Отображаем сеть.
     */

    if (
        availableBitrate
    ) {

        networkInfo.textContent =
            formatBitrate(
                availableBitrate
            );

    }


    /*
     * Вычисляем процент потерь.
     */

    const loss =
        packetsSent > 0
            ? packetsLost /
              (
                packetsSent +
                packetsLost
              )
            : 0;


    /*
     * Уровень проблемы.
     */

    let bad = false;

    let veryBad = false;


    if (
        availableBitrate !== null
    ) {

        if (
            availableBitrate <
            LEVELS[
                state.currentLevel
            ].bitrate * 0.65
        ) {

            bad = true;

        }


        if (
            availableBitrate <
            LEVELS[
                state.currentLevel
            ].bitrate * 0.4
        ) {

            veryBad = true;

        }

    }


    if (
        loss > 0.08
    ) {

        bad = true;

    }


    if (
        loss > 0.15
    ) {

        veryBad = true;

    }


    if (
        roundTripTime !== null &&
        roundTripTime > 0.6
    ) {

        bad = true;

    }


    /*
     * Плохая сеть.
     */

    if (veryBad) {

        await decreaseQuality();

        return;
    }


    if (bad) {

        await decreaseQuality();

        return;
    }


    /*
     * Хорошая сеть.
     *
     * Повышаем качество
     * только постепенно.
     */

    if (
        availableBitrate !== null &&
        availableBitrate >
            LEVELS[
                state.currentLevel
            ].bitrate * 1.7 &&

        loss < 0.02 &&

        (
            roundTripTime === null ||
            roundTripTime < 0.25
        )
    ) {

        await increaseQuality();

    }


    /*
     * Статус.
     */

    if (veryBad) {

        setStatus(
            "ПЛОХАЯ СВЯЗЬ",
            "bad"
        );

    } else if (bad) {

        setStatus(
            "АДАПТАЦИЯ",
            "warning"
        );

    } else {

        setStatus(
            "LIVE",
            "ok"
        );

    }

}


/* =========================================================
   DECREASE QUALITY
========================================================= */

async function decreaseQuality() {

    if (
        state.currentLevel <= 0
    ) {

        return;
    }


    state.currentLevel--;


    const level =
        LEVELS[
            state.currentLevel
        ];


    const sender =
        getVideoSender();


    if (!sender) {
        return;
    }


    const parameters =
        sender.getParameters();


    if (
        !parameters.encodings ||
        !parameters.encodings.length
    ) {

        parameters.encodings = [{}];

    }


    parameters.encodings[0]
        .maxBitrate =
        level.bitrate;


    parameters.encodings[0]
        .maxFramerate =
        level.fps;


    parameters.degradationPreference =
        "maintain-resolution";


    try {

        await sender.setParameters(
            parameters
        );


        toast(
            `Качество: ${level.name}`
        );


        qualityInfo.textContent =
            level.name;

    } catch (error) {

        console.debug(
            "Adaptive decrease:",
            error
        );

    }

}


/* =========================================================
   INCREASE QUALITY
========================================================= */

async function increaseQuality() {

    if (
        state.currentLevel >=
        LEVELS.length - 1
    ) {

        return;
    }


    state.currentLevel++;


    const level =
        LEVELS[
            state.currentLevel
        ];


    const sender =
        getVideoSender();


    if (!sender) {
        return;
    }


    const parameters =
        sender.getParameters();


    if (
        !parameters.encodings ||
        !parameters.encodings.length
    ) {

        parameters.encodings = [{}];

    }


    parameters.encodings[0]
        .maxBitrate =
        level.bitrate;


    parameters.encodings[0]
        .maxFramerate =
        level.fps;


    try {

        await sender.setParameters(
            parameters
        );


        toast(
            `Качество: ${level.name}`
        );


        qualityInfo.textContent =
            level.name;

    } catch (error) {

        console.debug(
            "Adaptive increase:",
            error
        );

    }

}


/* =========================================================
   GET VIDEO SENDER
========================================================= */

function getVideoSender() {

    const pc =
        state.call &&
        state.call.peerConnection;


    if (!pc) {
        return null;
    }


    return pc
        .getSenders()
        .find(
            sender =>
                sender.track &&
                sender.track.kind ===
                "video"
        ) || null;
}


/* =========================================================
   FORMAT BITRATE
========================================================= */

function formatBitrate(
    bitrate
) {

    if (
        bitrate >= 1000000
    ) {

        return (
            (
                bitrate /
                1000000
            ).toFixed(1)
        ) + " Mbps";

    }


    return (
        Math.round(
            bitrate /
            1000
        )
    ) + " Kbps";

}


/* =========================================================
   TORCH
========================================================= */

async function toggleTorch() {

    if (
        !state.videoTrack
    ) {

        return;
    }


    try {

        state.torchOn =
            !state.torchOn;


        await state.videoTrack
            .applyConstraints({

                advanced: [

                    {
                        torch:
                            state.torchOn
                    }

                ]

            });


        $("torch-btn")
            .textContent =
            state.torchOn
                ? "💡 Выключить"
                : "💡 Вспышка";


    } catch (error) {

        state.torchOn =
            false;


        toast(
            "Фонарик недоступен"
        );

    }

}


/* =========================================================
   FLIP CAMERA
========================================================= */

async function flipCamera() {

    state.facingMode =
        state.facingMode ===
        "environment"
            ? "user"
            : "environment";


    try {

        const newStream =
            await getCameraStream(
                state.currentLevel
            );


        const newTrack =
            newStream
                .getVideoTracks()[0];


        const sender =
            getVideoSender();


        if (sender) {

            await sender
                .replaceTrack(
                    newTrack
                );

            toast(
                "Камера переключена"
            );

        }


    } catch (error) {

        console.error(
            error
        );


        toast(
            "Не удалось переключить камеру"
        );

    }

}


/* =========================================================
   STOP
========================================================= */

function stopCamera() {

    stopAdaptiveMonitoring();


    if (state.call) {

        try {
            state.call.close();
        } catch {}

        state.call =
            null;

    }


    if (state.peer) {

        try {
            state.peer.destroy();
        } catch {}

        state.peer =
            null;

    }


    stopStream();


    cameraVideo.srcObject =
        null;


    cameraView.classList
        .remove("active");


    cameraConnect.style.display =
        "flex";


    $("connect-btn")
        .disabled = false;


    setStatus(
        "CONNECTING"
    );

}


/* =========================================================
   SCREEN SWITCH
========================================================= */

function showStart() {

    stopCamera();


    cameraScreen.classList
        .remove("active");

    startScreen.classList
        .add("active");

}


/* =========================================================
   EVENTS
========================================================= */

document.addEventListener(
    "click",
    event => {

        const mode =
            event.target.closest(
                "[data-mode]"
            );


        if (mode) {

            const selected =
                mode.dataset.mode;


            startScreen.classList
                .remove("active");


            if (
                selected ===
                "camera"
            ) {

                cameraScreen.classList
                    .add("active");

            }


            if (
                selected ===
                "monitor"
            ) {

                window.location.href =
                    "./monitor.html";

            }

        }

    }
);


$("connect-btn")
    .addEventListener(
        "click",
        connectCamera
    );


$("back-btn")
    .addEventListener(
        "click",
        showStart
    );


$("stop-btn")
    .addEventListener(
        "click",
        stopCamera
    );


$("torch-btn")
    .addEventListener(
        "click",
        toggleTorch
    );


$("flip-btn")
    .addEventListener(
        "click",
        flipCamera
    );


/* =========================================================
   AUTO ROOM
========================================================= */

window.addEventListener(
    "DOMContentLoaded",
    () => {

        const params =
            new URLSearchParams(
                window.location.search
            );


        const mode =
            params.get("m");

        const room =
            params.get("room");


        if (
            mode === "monitor"
        ) {

            window.location.href =
                "./monitor.html";

            return;
        }


        if (
            mode === "camera" ||
            room
        ) {

            startScreen.classList
                .remove("active");

            cameraScreen.classList
                .add("active");


            if (room) {

                connectionCode.value =
                    room
                        .toUpperCase()
                        .slice(0, 6);

            }

        }

    }
);


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        stopAdaptiveMonitoring();

        stopStream();

        if (state.call) {

            try {
                state.call.close();
            } catch {}

        }

        if (state.peer) {

            try {
                state.peer.destroy();
            } catch {}

        }

    }
);

</script>
