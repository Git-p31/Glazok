<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050508">
    <title>Glazok Studio — Monitor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg: #050508;
            --panel: rgba(255,255,255,.055);
            --border: rgba(255,255,255,.10);
            --text: #f8fafc;
            --muted: #7c8495;
            --accent: #6366f1;
            --green: #10b981;
            --red: #ef4444;
            --radius: 18px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: var(--bg); color: var(--text);
            font-family: system-ui, -apple-system, sans-serif;
            display: flex; align-items: center; justify-content: center;
        }
        .app { width: min(900px, 92vw); display: flex; flex-direction: column; gap: 22px; }
        .header { display: flex; align-items: center; justify-content: space-between; }
        .brand { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 700; }
        .brand-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 20px rgba(99,102,241,.7); }
        .connection { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
        .connection-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
        .connection-dot.ready { background: var(--green); box-shadow: 0 0 10px rgba(16,185,129,.8); }
        .connection-dot.live { background: var(--red); box-shadow: 0 0 10px rgba(239,68,68,.8); animation: pulse 1.5s infinite; }
        @keyframes pulse { 50% { opacity: .45; } }
        .room-card { padding: 32px; border: 1px solid var(--border); border-radius: var(--radius); background: linear-gradient(145deg, rgba(255,255,255,.07), rgba(255,255,255,.025)); backdrop-filter: blur(30px); }
        .room-label { margin-bottom: 10px; color: var(--muted); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; }
        .room-code { font-family: monospace; font-size: clamp(42px, 8vw, 72px); font-weight: 700; letter-spacing: .12em; color: var(--text); cursor: pointer; user-select: all; }
        .room-hint { margin-top: 10px; color: var(--muted); font-size: 13px; }
        .actions { display: flex; gap: 10px; }
        button { border: 0; outline: 0; cursor: pointer; font: inherit; }
        .btn { min-height: 46px; padding: 0 20px; border-radius: 999px; font-size: 14px; font-weight: 700; transition: transform .15s ease; }
        .btn:hover { transform: translateY(-1px); }
        .btn-primary { background: #fff; color: #000; }
        .btn-secondary { background: var(--panel); color: var(--text); border: 1px solid var(--border); }
        .video-container { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: var(--radius); background: #000; border: 1px solid var(--border); }
        #video { width: 100%; height: 100%; display: block; object-fit: cover; background: #000; }
        .video-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; color: var(--muted); font-size: 14px; }
        .video-overlay.hidden { display: none; }
        .footer { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 12px; }
        .stats { display: flex; gap: 18px; }
        .stat strong { color: var(--text); }
        @media (max-width: 600px) {
            .room-card { padding: 24px; }
            .actions { flex-direction: column; }
            .btn { width: 100%; }
            .footer { display: none; }
        }
    
html, body { overflow-y: auto; }
.app { margin: auto; padding: 20px 0; }
.room-card { display: flex; align-items: center; justify-content: space-between; gap: 28px; }
.room-info { min-width: 0; }
.qr-box { flex: 0 0 auto; width: 190px; text-align: center; }
#qr { width: 190px; height: 190px; padding: 10px; border-radius: 14px; background: #fff; color: #000; font-size: 12px; display: flex; align-items: center; justify-content: center; }
#qr img, #qr canvas { width: 100% !important; height: 100% !important; display: block; }
.qr-hint { margin-top: 8px; color: var(--muted); font-size: 12px; line-height: 1.4; }
.qr-link { margin-top: 2px; color: var(--muted); font-size: 10px; word-break: break-all; opacity: .7; }
.qr-warn { margin-top: 8px; color: #f59e0b; font-size: 11px; line-height: 1.4; }
.qr-warn[hidden] { display: none; }

.video-container { touch-action: none; }
#video { transform-origin: center; will-change: transform; }
.zoom-bar { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border: 1px solid var(--border); border-radius: 14px; background: var(--panel); }
.zoom-mode { flex: 0 0 auto; min-width: 130px; color: var(--muted); font-size: 12px; }
.zoom-bar input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
.zoom-bar input[type=range]:disabled { opacity: .4; }
.zoom-value { min-width: 44px; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.zoom-reset { min-height: 34px; padding: 0 14px; border-radius: 999px; background: var(--panel); color: var(--text); border: 1px solid var(--border); font-size: 12px; font-weight: 700; }

@media (max-width: 700px) {
  .room-card { flex-direction: column; align-items: flex-start; }
  .qr-box { align-self: center; }
  .zoom-mode { display: none; }
}
</style>
</head>
<body>

<div class="app">
    <header class="header">
        <div class="brand">
            <span class="brand-dot"></span>
            <span>Glazok Studio</span>
        </div>
        <div class="connection">
            <span id="connection-dot" class="connection-dot"></span>
            <span id="connection-text">Создание комнаты...</span>
        </div>
    </header>

    <section class="room-card">
            <div class="room-info">
                <div class="room-label">Код комнаты</div>
                <div id="room-code" class="room-code" title="Нажмите, чтобы скопировать">------</div>
                <div class="room-hint">Отсканируйте QR-код камерой телефона или введите код вручную</div>
            </div>
            <div class="qr-box">
                <div id="qr"></div>
                <div class="qr-hint">QR для подключения камеры</div>
                <div id="qr-link" class="qr-link"></div>
                <div id="qr-warn" class="qr-warn" hidden></div>
            </div>
        </section>

    <div class="actions">
        <button id="copy-btn" class="btn btn-primary">Скопировать код</button>
        <button id="clean-btn" class="btn btn-secondary">Открыть Clean Output</button>
    </div>

    <section id="video-box" class="video-container">
        <video id="video" autoplay playsinline muted></video>
        <div id="video-overlay" class="video-overlay">Ожидание камеры...</div>
    </section>

    <div class="zoom-bar">
            <div id="zoom-mode" class="zoom-mode">Зум</div>
            <input id="zoom-range" type="range" min="1" max="4" step="0.05" value="1" disabled aria-label="Зум">
            <div id="zoom-value" class="zoom-value">1.0×</div>
            <button id="zoom-reset" class="zoom-reset" type="button">Сброс</button>
        </div>

        <footer class="footer">
        <div class="stats">
            <div class="stat">Качество: <strong id="quality">—</strong></div>
            <div class="stat">FPS: <strong id="fps">—</strong></div>
        </div>
        <div>Glazok WebRTC (Ultra-Low Latency)</div>
    </footer>
</div>

<script>
"use strict";

const $ = id => document.getElementById(id);

const video = $("video");
const videoBox = $("video-box");
const roomCode = $("room-code");
const connectionDot = $("connection-dot");
const connectionText = $("connection-text");
const overlay = $("video-overlay");
const copyBtn = $("copy-btn");
const cleanBtn = $("clean-btn");
const quality = $("quality");
const fps = $("fps");
const qrEl = $("qr");
const qrLink = $("qr-link");
const qrWarn = $("qr-warn");
const zoomBar = $("zoom-bar");
const zoomRange = $("zoom-range");
const zoomValue = $("zoom-value");
const zoomMode = $("zoom-mode");
const zoomReset = $("zoom-reset");

const ICE_SERVERS = [
  { urls: "stun:stun.relay.metered.ca:80" },
  { urls: "turn:standard.relay.metered.ca:80", username: "35162de63b0eb72fbb27f4e3", credential: "ZbW2aJl3WmRUyOss" },
  { urls: "turn:standard.relay.metered.ca:80?transport=tcp", username: "35162de63b0eb72fbb27f4e3", credential: "ZbW2aJl3WmRUyOss" },
  { urls: "turn:standard.relay.metered.ca:443", username: "35162de63b0eb72fbb27f4e3", credential: "ZbW2aJl3WmRUyOss" },
  { urls: "turns:standard.relay.metered.ca:443?transport=tcp", username: "35162de63b0eb72fbb27f4e3", credential: "ZbW2aJl3WmRUyOss" }
];

let peer = null;
let cameraCall = null;
let ctrlConn = null;
let room = null;
let activeStream = null;
let reconnectTimer = null;
let statsTimer = null;
let failCount = 0;
let prevBytes = null;
const viewers = new Set();

const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

function generateRoomCode() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let result = "";
  for (let i = 0; i < 6; i++) result += chars[Math.floor(Math.random() * chars.length)];
  return result;
}

function setConnection(text, state = "") {
  connectionText.textContent = text;
  connectionDot.className = "connection-dot " + state;
}

/* ---------- QR ---------- */

function renderQR() {
  const url = new URL("./index.html", window.location.href);
  url.search = "";
  url.hash = "";
  url.searchParams.set("room", room);

  qrEl.innerHTML = "";
  if (typeof QRCode === "undefined") {
    qrEl.textContent = "QR недоступен";
  } else {
    try {
      new QRCode(qrEl, {
        text: url.href,
        width: 320,
        height: 320,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });
    } catch (error) {
      console.error("QR error:", error);
      qrEl.textContent = "QR недоступен";
    }
  }
  qrLink.textContent = url.host + url.pathname;

  const host = url.hostname;
  const local = host === "localhost" || host === "127.0.0.1" || host === "[::1]" || url.protocol === "file:";
  qrWarn.hidden = !local;
  if (local) qrWarn.textContent = "QR ведёт на localhost — телефон его не откроет. Откройте монитор по HTTPS-адресу (например GitHub Pages).";
}

/* ---------- Комната ---------- */

function destroyPeer() {
  clearTimeout(reconnectTimer);
  if (cameraCall) { const c = cameraCall; cameraCall = null; try { c.close(); } catch {} }
  ctrlConn = null;
  if (peer) { const p = peer; peer = null; try { p.destroy(); } catch {} }
}

function scheduleReconnect() {
  clearTimeout(reconnectTimer);
  failCount++;
  const delay = Math.min(1000 * failCount, 8000);
  reconnectTimer = setTimeout(() => {
    if (!peer || peer.destroyed) { createRoom(room); return; }
    if (peer.disconnected) {
      try { peer.reconnect(); } catch { createRoom(room); }
    }
  }, delay);
}

function createRoom(keepCode) {
  destroyPeer();
  room = keepCode || generateRoomCode();
  roomCode.textContent = room;
  renderQR();
  setConnection("Создание комнаты...", "");

  const p = new Peer("glz-" + room.toLowerCase(), {
    config: { iceServers: ICE_SERVERS, sdpSemantics: "unified-plan" }
  });
  peer = p;

  p.on("open", () => {
    if (peer !== p) return;
    failCount = 0;
    if (cameraCall) setConnection("Камера подключена", "live");
    else setConnection("Ожидание камеры", "ready");
  });

  p.on("connection", conn => {
    conn.on("data", data => {
      if (!data) return;
      if (data.type === "clean-view" && data.viewerId) {
        viewers.add(data.viewerId);
        if (activeStream) p.call(data.viewerId, activeStream);
      } else if (data.type === "caps") {
        ctrlConn = conn;
        applyCaps(data.zoom);
      } else if (data.type === "zoom-value" && zoomCaps && typeof data.value === "number") {
        zoomCaps.value = data.value;
        syncZoomUI();
      }
    });
    conn.on("close", () => {
      if (ctrlConn === conn) { ctrlConn = null; applyCaps(null); }
    });
  });

  p.on("call", incoming => {
    if (cameraCall && cameraCall !== incoming) {
      const old = cameraCall;
      cameraCall = null;
      try { old.close(); } catch {}
    }
    cameraCall = incoming;
    incoming.answer();

    incoming.on("stream", stream => {
      if (cameraCall !== incoming) return;
      activeStream = stream;
      video.srcObject = stream;
      video.muted = true;
      video.play().catch(() => {});
      overlay.classList.add("hidden");
      setConnection("Камера подключена", "live");
      startStats(incoming);
      updateVideoInfo();
      zoomRange.disabled = false;
      viewers.forEach(viewerId => p.call(viewerId, activeStream));
    });

    incoming.on("close", () => {
      if (cameraCall !== incoming) return;
      cameraCall = null;
      activeStream = null;
      video.srcObject = null;
      overlay.classList.remove("hidden");
      overlay.textContent = "Камера отключена — ждём переподключения…";
      setConnection("Ожидание камеры", "ready");
      quality.textContent = "—";
      fps.textContent = "—";
      stopStats();
      zoomRange.disabled = true;
    });

    incoming.on("error", error => {
      console.error("Call error:", error);
      if (cameraCall !== incoming) return;
      overlay.classList.remove("hidden");
      overlay.textContent = "Ошибка видеосоединения";
    });
  });

  p.on("error", error => {
    if (peer !== p) return;
    console.error("PeerJS error:", error);
    if (error.type === "unavailable-id") {
      createRoom(); // код занят — берём новый
    } else if (["network", "server-error", "socket-error", "socket-closed"].includes(error.type)) {
      setConnection("Нет связи с сервером…", "");
      scheduleReconnect();
    } else {
      setConnection("Ошибка: " + error.type, "");
    }
  });

  p.on("disconnected", () => {
    if (peer !== p) return;
    setConnection("Соединение потеряно — переподключение…", "");
    scheduleReconnect();
  });
}

/* ---------- Статистика приёма ---------- */

function startStats(call) {
  stopStats();
  prevBytes = null;
  statsTimer = setInterval(async () => {
    const pc = call.peerConnection;
    if (!pc || cameraCall !== call) return;
    try {
      const reports = await pc.getStats();
      reports.forEach(r => {
        if (r.type === "inbound-rtp" && r.kind === "video") {
          if (typeof r.framesPerSecond === "number") fps.textContent = Math.round(r.framesPerSecond);
          if (prevBytes !== null) {
            const kbps = (r.bytesReceived - prevBytes.bytes) * 8 / ((r.timestamp - prevBytes.ts) / 1000) / 1000;
            if (isFinite(kbps) && kbps >= 0) updateVideoInfo(kbps >= 1000 ? (kbps / 1000).toFixed(1) + " Mbps" : Math.round(kbps) + " Kbps");
          }
          prevBytes = { bytes: r.bytesReceived, ts: r.timestamp };
        }
      });
    } catch {}
  }, 2000);
}

function stopStats() {
  if (statsTimer) { clearInterval(statsTimer); statsTimer = null; }
}

function updateVideoInfo(bitrateText) {
  const w = video.videoWidth;
  const h = video.videoHeight;
  if (!w || !h) return;
  quality.textContent = `${w}×${h}` + (bitrateText ? ` • ${bitrateText}` : "");
}
video.addEventListener("resize", () => updateVideoInfo());

/* ---------- Зум ---------- */

let zoomCaps = null;                       // оптический зум камеры, если поддерживается
const digital = { scale: 1, x: 0, y: 0 };  // запасной цифровой зум на мониторе

function sendCtrl(message) {
  if (ctrlConn && ctrlConn.open) { try { ctrlConn.send(message); } catch {} }
}

function applyTransform() {
  video.style.transform = `translate(${digital.x}px, ${digital.y}px) scale(${digital.scale})`;
}

function clampPan() {
  const r = videoBox.getBoundingClientRect();
  const maxX = (digital.scale - 1) * r.width / 2;
  const maxY = (digital.scale - 1) * r.height / 2;
  digital.x = clamp(digital.x, -maxX, maxX);
  digital.y = clamp(digital.y, -maxY, maxY);
}

function setDigital(scale) {
  digital.scale = clamp(scale, 1, 4);
  if (digital.scale === 1) { digital.x = 0; digital.y = 0; }
  clampPan();
  applyTransform();
}

function syncZoomUI() {
  const value = zoomCaps ? zoomCaps.value : digital.scale;
  zoomRange.value = value;
  zoomValue.textContent = Number(value).toFixed(1) + "×";
}

function applyCaps(z) {
  zoomCaps = z || null;
  setDigital(1);
  if (zoomCaps) {
    zoomRange.min = zoomCaps.min;
    zoomRange.max = zoomCaps.max;
    zoomRange.step = zoomCaps.step || 0.1;
    zoomMode.textContent = "Оптический зум камеры";
  } else {
    zoomRange.min = 1;
    zoomRange.max = 4;
    zoomRange.step = 0.05;
    zoomMode.textContent = "Цифровой зум";
  }
  zoomRange.disabled = !activeStream;
  syncZoomUI();
}

function setZoomValue(value) {
  if (zoomCaps) {
    zoomCaps.value = clamp(value, zoomCaps.min, zoomCaps.max);
    sendCtrl({ type: "zoom", value: zoomCaps.value });
  } else {
    setDigital(value);
  }
  syncZoomUI();
}

zoomRange.addEventListener("input", () => setZoomValue(Number(zoomRange.value)));
zoomReset.addEventListener("click", () => setZoomValue(zoomCaps ? zoomCaps.min : 1));
videoBox.addEventListener("dblclick", () => setZoomValue(zoomCaps ? zoomCaps.min : 1));

videoBox.addEventListener("wheel", e => {
  if (!activeStream) return;
  e.preventDefault();
  const current = zoomCaps ? zoomCaps.value : digital.scale;
  setZoomValue(current * (e.deltaY < 0 ? 1.1 : 1 / 1.1));
}, { passive: false });

/* Перетаскивание кадра при цифровом зуме */
let drag = null;
videoBox.addEventListener("pointerdown", e => {
  if (zoomCaps || digital.scale <= 1) return;
  drag = { x: e.clientX, y: e.clientY, ox: digital.x, oy: digital.y };
  videoBox.setPointerCapture(e.pointerId);
});
videoBox.addEventListener("pointermove", e => {
  if (!drag) return;
  digital.x = drag.ox + (e.clientX - drag.x);
  digital.y = drag.oy + (e.clientY - drag.y);
  clampPan();
  applyTransform();
});
videoBox.addEventListener("pointerup", () => { drag = null; });
videoBox.addEventListener("pointercancel", () => { drag = null; });

/* ---------- Кнопки ---------- */

async function copyRoom() {
  try {
    await navigator.clipboard.writeText(room);
    copyBtn.textContent = "Скопировано";
    setTimeout(() => { copyBtn.textContent = "Скопировать код"; }, 1500);
  } catch {
    console.log("Room:", room);
  }
}

function openCleanOutput() {
  const url = new URL("./view.html", window.location.href);
  url.searchParams.set("room", room);
  window.open(url.href, "_blank");
}

copyBtn.addEventListener("click", copyRoom);
cleanBtn.addEventListener("click", openCleanOutput);
roomCode.addEventListener("click", copyRoom);

window.addEventListener("online", () => { if (peer && peer.disconnected) { failCount = 0; scheduleReconnect(); } });

window.addEventListener("beforeunload", () => {
  stopStats();
  destroyPeer();
});

applyCaps(null);
createRoom();

</script>
</body>
</html>
