<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050508">
    <title>Glazok Studio — Monitor</title>
    <script src="./config.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg: #050508;
            --panel: rgba(255,255,255,.055);
            --border: rgba(255,255,255,.10);
            --text: #f8fafc;
            --muted: #7c8495;
            --accent: #6366f1;
            --green: #10b981;
            --red: #ef4444;
            --radius: 18px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body {
            width: 100%; height: 100%;
            overflow-y: auto;
            background: var(--bg); color: var(--text);
            font-family: system-ui, -apple-system, sans-serif;
        }

        /* Боковая панель устройств слева */
        #devices-sidebar {
            position: fixed;
            left: 24px;
            top: 50%;
            transform: translateY(-50%);
            width: 260px;
            background: linear-gradient(145deg, rgba(255,255,255,.07), rgba(255,255,255,.025));
            backdrop-filter: blur(30px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px;
            color: var(--text);
            z-index: 100;
        }

        #devices-sidebar h3 {
            font-size: 13px;
            margin-bottom: 12px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .08em;
        }

        .device-item {
            background: var(--panel);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 8px;
            border: 1px solid var(--border);
            transition: transform .15s ease, border-color .15s ease;
            cursor: pointer;
        }
        .device-item.selected { border-color: rgba(99,102,241,.8); box-shadow: 0 0 0 1px rgba(99,102,241,.35); }
        .device-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .device-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .icon-btn { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 8px; background: transparent; color: var(--muted); font-size: 14px; }
        .icon-btn:hover { background: var(--panel); color: var(--text); }
        .dev-btn { width: 100%; margin-top: 10px; min-height: 34px; border-radius: 999px; font-size: 12px; font-weight: 700; background: #fff; color: #000; }
        .dev-btn.stop { background: rgba(239,68,68,.16); color: #fca5a5; border: 1px solid rgba(239,68,68,.45); }
        .dev-btn.switch { background: var(--accent); color: #fff; }
        .device-empty { color: var(--muted); font-size: 12px; line-height: 1.5; }

        .device-item.active {
            border-left: 4px solid var(--green);
            background: rgba(16, 185, 129, 0.08);
        }

        .device-title {
            font-size: 13px;
            font-weight: 700;
        }

        .device-info {
            font-size: 12px;
            color: var(--muted);
            margin-top: 4px;
        }

        .device-info span {
            color: var(--green);
        }

        .device-info span.waiting {
            color: #f59e0b;
        }

        /* Основной контейнер приложения */
        .app { 
            width: min(900px, 92vw); 
            margin: auto; 
            padding: 30px 0; 
            display: flex; 
            flex-direction: column; 
            gap: 22px; 
        }

        .header { display: flex; align-items: center; justify-content: space-between; }
        .brand { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 700; }
        .brand-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 20px rgba(99,102,241,.7); }
        .connection { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
        .connection-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
        .connection-dot.ready { background: var(--green); box-shadow: 0 0 10px rgba(16,185,129,.8); }
        .connection-dot.live { background: var(--red); box-shadow: 0 0 10px rgba(239,68,68,.8); animation: pulse 1.5s infinite; }
        @keyframes pulse { 50% { opacity: .45; } }

        .room-card { 
            padding: 32px; 
            border: 1px solid var(--border); 
            border-radius: var(--radius); 
            background: linear-gradient(145deg, rgba(255,255,255,.07), rgba(255,255,255,.025)); 
            backdrop-filter: blur(30px); 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            gap: 28px; 
        }
        .room-info { min-width: 0; }
        .room-label { margin-bottom: 10px; color: var(--muted); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; }
        .room-code { font-family: monospace; font-size: clamp(36px, 7vw, 64px); font-weight: 700; letter-spacing: .12em; color: var(--text); cursor: pointer; user-select: all; }
        .room-hint { margin-top: 10px; color: var(--muted); font-size: 13px; }

        .qr-box { flex: 0 0 auto; width: 190px; text-align: center; }
        #qr { width: 190px; height: 190px; padding: 10px; border-radius: 14px; background: #fff; color: #000; font-size: 12px; display: flex; align-items: center; justify-content: center; }
        #qr img, #qr canvas { width: 100% !important; height: 100% !important; display: block; }
        .qr-hint { margin-top: 8px; color: var(--muted); font-size: 12px; line-height: 1.4; }
        .qr-link { margin-top: 2px; color: var(--muted); font-size: 10px; word-break: break-all; opacity: .7; }
        .qr-warn { margin-top: 8px; color: #f59e0b; font-size: 11px; line-height: 1.4; }
        .qr-warn[hidden] { display: none; }

        .actions { display: flex; gap: 10px; flex-wrap: wrap; }
        button { border: 0; outline: 0; cursor: pointer; font: inherit; }
        .btn { min-height: 46px; padding: 0 20px; border-radius: 999px; font-size: 14px; font-weight: 700; transition: transform .15s ease; }
        .btn:hover { transform: translateY(-1px); }
        .btn:disabled { opacity: .45; cursor: default; transform: none; }
        .btn-primary { background: #fff; color: #000; }
        .btn-secondary { background: var(--panel); color: var(--text); border: 1px solid var(--border); }

        .video-container { 
            position: relative; 
            width: 100%; 
            aspect-ratio: 16 / 9; 
            overflow: hidden; 
            border-radius: var(--radius); 
            background: #000; 
            border: 1px solid var(--border); 
            touch-action: none;
            margin-left: auto; 
            margin-right: auto;
        }
        #video { 
            width: 100%; 
            height: 100%; 
            display: block; 
            object-fit: contain; 
            background: #000; 
            transform-origin: center; 
            will-change: transform; 
        }
        .video-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; color: var(--muted); font-size: 14px; }
        .video-overlay.hidden { display: none; }

        .zoom-bar { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border: 1px solid var(--border); border-radius: 14px; background: var(--panel); }
        .zoom-mode { flex: 0 0 auto; min-width: 130px; color: var(--muted); font-size: 12px; }
        .zoom-bar input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
        .zoom-bar input[type=range]:disabled { opacity: .4; }
        .zoom-value { min-width: 44px; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
        .zoom-reset { min-height: 34px; padding: 0 14px; border-radius: 999px; background: var(--panel); color: var(--text); border: 1px solid var(--border); font-size: 12px; font-weight: 700; }

        .approve { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 18px; border: 1px solid rgba(99,102,241,.5); border-radius: 14px; background: rgba(99,102,241,.12); font-size: 14px; }
        .approve[hidden] { display: none; }
        .approve span { flex: 1 1 220px; }

        .footer { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 12px; }
        .stats { display: flex; gap: 18px; }
        .stat strong { color: var(--text); }

        .toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); padding: 11px 18px; border-radius: 999px; background: rgba(15,15,20,.95); border: 1px solid var(--border); font-size: 13px; opacity: 0; pointer-events: none; transition: .2s; z-index: 50; }
        .toast.show { opacity: 1; transform: translate(-50%, 0); }

        @media (max-width: 1350px) {
            /* Список камер не прячем: на узком экране он идёт блоком над основной областью */
            #devices-sidebar { position: static; transform: none; width: min(900px, 92vw); margin: 20px auto 0; }
        }

        .btn-live { background: var(--green); color: #04130d; }
        .btn-live.stop { background: var(--red); color: #fff; }
        .turn-status { font-size: 12px; line-height: 1.5; color: var(--muted); }
        .turn-status.ok { color: var(--green); }
        .turn-status.warn { color: #f59e0b; }

        @media (max-width: 600px) {
            .room-card { padding: 24px; flex-direction: column; align-items: flex-start; }
            .qr-box { align-self: center; }
            .zoom-mode { display: none; }
            .actions { flex-direction: column; }
            .btn { width: 100%; }
            .footer { display: none; }
        }
    </style>
</head>
<body>

<!-- Динамическая панель подключенных устройств -->
<div id="devices-sidebar">
    <h3>Подключенные камеры</h3>
    <div id="devices-list">
        <div class="device-empty">Ожидание подключений...</div>
    </div>
</div>

<div class="app">
    <header class="header">
        <div class="brand">
            <span class="brand-dot"></span>
            <span>Glazok Studio</span>
        </div>
        <div class="connection">
            <span id="connection-dot" class="connection-dot"></span>
            <span id="connection-text">Создание комнаты...</span>
        </div>
    </header>

    <div id="approve" class="approve" hidden>
        <span id="approve-text"></span>
        <button id="approve-yes" class="btn btn-primary" type="button">Разрешить</button>
        <button id="approve-no" class="btn btn-secondary" type="button">Отклонить</button>
    </div>

    <section class="room-card">
        <div class="room-info">
            <div class="room-label">Код комнаты</div>
            <div id="room-code" class="room-code" title="Нажмите, чтобы скопировать">------</div>
            <div class="room-hint">Отсканируйте QR-код камерой телефона или введите код вручную</div>
        </div>
        <div class="qr-box">
            <div id="qr"></div>
            <div class="qr-hint">QR для подключения камеры</div>
            <div id="qr-link" class="qr-link"></div>
            <div id="qr-warn" class="qr-warn" hidden></div>
        </div>
    </section>

    <div class="actions">
        <button id="live-btn" class="btn btn-live" type="button" disabled>Запустить эфир</button>
        <button id="copy-btn" class="btn btn-primary">Скопировать код</button>
        <button id="clean-btn" class="btn btn-secondary">Открыть Clean Output</button>
        <button id="turn-btn" class="btn btn-secondary" type="button">Проверить TURN</button>
    </div>
    <div id="turn-status" class="turn-status">TURN: проверка…</div>

    <section id="video-box" class="video-container">
        <video id="video" autoplay playsinline muted></video>
        <div id="video-overlay" class="video-overlay">Ожидание камеры...</div>
    </section>

    <div class="zoom-bar">
        <div id="zoom-mode" class="zoom-mode">Зум</div>
        <input id="zoom-range" type="range" min="1" max="4" step="0.05" value="1" disabled aria-label="Зум">
        <div id="zoom-value" class="zoom-value">1.0×</div>
        <button id="zoom-reset" class="zoom-reset" type="button">Сброс</button>
    </div>

    <footer class="footer">
        <div class="stats">
            <div class="stat">Качество: <strong id="quality">—</strong></div>
            <div class="stat">FPS: <strong id="fps">—</strong></div>
            <div class="stat">Связь: <strong id="route">—</strong></div>
        </div>
        <div id="app-version">Glazok v10</div>
    </footer>
</div>

<div id="toast" class="toast"></div>

<script>
"use strict";

if (!window.GLAZOK) {
  document.body.innerHTML = '<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:#f8fafc;background:#050508;font:16px system-ui">Не найден config.js — загрузите его в репозиторий рядом с этим файлом и обновите страницу.</div>';
  throw new Error("config.js missing");
}

const $ = id => document.getElementById(id);

const video = $("video");
const videoBox = $("video-box");
const roomCode = $("room-code");
const connectionDot = $("connection-dot");
const connectionText = $("connection-text");
const overlay = $("video-overlay");
const copyBtn = $("copy-btn");
const cleanBtn = $("clean-btn");
const liveBtn = $("live-btn");
const turnBtn = $("turn-btn");
const turnStatus = $("turn-status");
const quality = $("quality");
const fps = $("fps");
const routeEl = $("route");
const qrEl = $("qr");
const qrLink = $("qr-link");
const qrWarn = $("qr-warn");
const zoomRange = $("zoom-range");
const zoomValue = $("zoom-value");
const zoomMode = $("zoom-mode");
const zoomReset = $("zoom-reset");
const approveBox = $("approve");
const approveText = $("approve-text");
const devicesList = $("devices-list");
const toastEl = $("toast");

let peer = null;
let peerOpen = false;
let cameraCall = null;       // единственный входящий видеозвонок
let room = null;
let activeStream = null;
let reconnectTimer = null;
let statsTimer = null;
let failCount = 0;
let roomToken = null;
let pending = null;          // { conn, md } — камера ждёт ручного подтверждения
let liveCid = null;          // телефон, которому велено транслировать (или уже транслирует)
let selectedCid = null;      // телефон, выбранный в списке
let graceTimer = null;
let startTimer = null;
let prevBytes = null;
let lastViewMsg = null;

const approved = new Set();           // cid камер, которым разрешено подключение
const cams = new Map();               // cid -> описание подключённой камеры (одна запись на телефон)
const indexByCid = new Map();         // cid -> порядковый номер для названия «Телефон N»
const viewerCalls = new Map();        // viewerId -> MediaConnection
const viewerConns = new Map();        // viewerId -> DataConnection
const viewers = new Set();

const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const escapeHtml = text => String(text).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function generateRoomCode() {
  return GLAZOK.randomId(6, "ABCDEFGHJKLMNPQRSTUVWXYZ23456789");
}

let toastTimer = null;
function toast(message) {
  toastEl.textContent = message;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2600);
}

function setConnection(text, state = "") {
  connectionText.textContent = text;
  connectionDot.className = "connection-dot " + state;
}

/* ---------- Названия камер ---------- */

const NAMES_KEY = "glazok_cam_names";
function loadNames() { try { return JSON.parse(localStorage.getItem(NAMES_KEY) || "{}") || {}; } catch { return {}; } }
function saveName(cid, name) {
  const names = loadNames();
  if (name) names[cid] = name; else delete names[cid];
  try { localStorage.setItem(NAMES_KEY, JSON.stringify(names)); } catch {}
}

/* Приоритет: имя, заданное на мониторе → имя, введённое на телефоне → модель из браузера → «Телефон N» */
function camTitle(cam) {
  return cam.customLabel || cam.name || cam.model || ("Телефон " + cam.index);
}

function batteryText(cam) {
  if (typeof cam.battery === "number") return Math.round(cam.battery) + "%";
  return cam.hasBattery === false ? "н/д" : "…";
}

/* ---------- Список камер ---------- */

function camState(cam) {
  if (liveCid === cam.cid) return activeStream ? "live" : "starting";
  return "waiting";
}

function renderDevices() {
  if (cams.size === 0) {
    devicesList.innerHTML = '<div class="device-empty">Ожидание подключений...<br>Подключённые телефоны ждут команды «Запустить эфир» и видео не передают.</div>';
    return;
  }
  let html = "";
  cams.forEach(cam => {
    const st = camState(cam);
    const icon = cam.charging ? "⚡" : "🔋";
    const statusText = st === "live" ? "<span>В эфире</span>"
      : st === "starting" ? '<span class="waiting">Запуск…</span>'
      : '<span class="waiting">Ожидание</span>';
    const batteryTip = cam.hasBattery === false ? ' title="Браузер этого телефона не сообщает заряд (iPhone/Safari, Firefox)"' : "";

    let action, label, cls = "";
    if (!liveCid) { action = "start"; label = "Запустить эфир"; }
    else if (liveCid === cam.cid) { action = "stop"; label = "Остановить эфир"; cls = "stop"; }
    else { action = "start"; label = "Переключить сюда"; cls = "switch"; }

    html += `
      <div class="device-item ${st === "live" ? "active" : ""} ${selectedCid === cam.cid ? "selected" : ""}" data-cid="${escapeHtml(cam.cid)}">
        <div class="device-head">
          <div class="device-title">${escapeHtml(camTitle(cam))}</div>
          <button class="icon-btn" data-act="rename" title="Переименовать" type="button">✎</button>
        </div>
        <div class="device-info"${batteryTip}>${icon} ${batteryText(cam)} • ${statusText}</div>
        <button class="dev-btn ${cls}" data-act="${action}" type="button">${label}</button>
      </div>`;
  });
  devicesList.innerHTML = html;
}

devicesList.addEventListener("click", event => {
  const item = event.target.closest(".device-item");
  if (!item) return;
  const cid = item.dataset.cid;
  const act = event.target.closest("[data-act]");
  if (act && act.dataset.act === "rename") { renameCam(cid); return; }
  if (act && act.dataset.act === "start") { startLive(cid); return; }
  if (act && act.dataset.act === "stop") { stopLive(); return; }
  selectedCid = cid;     // просто выбор: эфир не запускается и не переключается
  refreshAll();
});

function renameCam(cid) {
  const cam = cams.get(cid);
  if (!cam) return;
  const value = prompt("Название телефона (пусто — вернуть автоматическое):", camTitle(cam));
  if (value === null) return;
  cam.customLabel = value.trim().slice(0, 40);
  saveName(cid, cam.customLabel);
  refreshAll();
}

/* ---------- Состояние интерфейса ---------- */

function updateHeader() {
  if (!peerOpen) return;
  const live = liveCid && cams.get(liveCid);
  if (live && activeStream) setConnection("В эфире: " + camTitle(live), "live");
  else if (liveCid) setConnection("Запуск эфира…", "ready");
  else if (cams.size) setConnection("Камер: " + cams.size + " • эфир выключен", "ready");
  else setConnection("Ожидание камеры", "ready");
}

function updateOverlay() {
  if (activeStream) { overlay.classList.add("hidden"); return; }
  overlay.classList.remove("hidden");
  if (liveCid) overlay.textContent = cams.has(liveCid) ? "Запуск эфира…" : "Камера отключилась — ждём возврата…";
  else if (cams.size) overlay.textContent = "Выберите телефон и нажмите «Запустить эфир»";
  else overlay.textContent = "Ожидание камеры...";
}

function updateLiveBtn() {
  const sel = cams.get(selectedCid);
  liveBtn.classList.remove("stop");
  if (!sel) { liveBtn.textContent = "Запустить эфир"; liveBtn.disabled = true; return; }
  liveBtn.disabled = false;
  if (!liveCid) liveBtn.textContent = "Запустить эфир на «" + camTitle(sel) + "»";
  else if (liveCid !== sel.cid) liveBtn.textContent = "Переключить эфир на «" + camTitle(sel) + "»";
  else { liveBtn.textContent = "Остановить эфир"; liveBtn.classList.add("stop"); }
}

function refreshAll() {
  renderDevices();
  updateLiveBtn();
  updateOverlay();
  updateHeader();
}

liveBtn.addEventListener("click", () => {
  const sel = cams.get(selectedCid);
  if (!sel) return;
  if (liveCid === sel.cid) stopLive(); else startLive(sel.cid);
});

/* ---------- Эфир: старт, стоп, переключение ---------- */

function sendTo(cam, message) {
  if (cam && cam.conn && cam.conn.open) { try { cam.conn.send(message); return true; } catch {} }
  return false;
}

/*
 * Запускает эфир на телефоне cid. Если эфир уже идёт на другом телефоне — сначала
 * останавливаем его (команда go-idle + закрытие звонка), и только потом даём go-live новому.
 */
function startLive(cid) {
  const cam = cams.get(cid);
  if (!cam || !cam.conn.open) { toast("Телефон недоступен"); return; }
  if (liveCid === cid && (activeStream || cameraCall)) return;
  if (liveCid && liveCid !== cid) stopLive(true);

  clearTimeout(graceTimer);
  liveCid = cid;
  selectedCid = cid;
  applyCaps();                       // зум: берём возможности именно этой камеры
  sendTo(cam, { type: "go-live" });

  clearTimeout(startTimer);
  startTimer = setTimeout(() => {
    if (liveCid === cid && !activeStream) toast("Телефон не отвечает — проверьте связь");
  }, 20000);
  refreshAll();
}

function stopLive(silent) {
  clearTimeout(graceTimer);
  clearTimeout(startTimer);
  const cam = cams.get(liveCid);
  liveCid = null;
  if (cam) sendTo(cam, { type: "go-idle" });
  teardownMedia();
  applyCaps();
  if (!silent) refreshAll();
}

function closeViewerCalls() {
  viewerCalls.forEach(call => { try { call.close(); } catch {} });
  viewerCalls.clear();
}

function teardownMedia() {
  if (cameraCall) { const c = cameraCall; cameraCall = null; try { c.close(); } catch {} }
  activeStream = null;
  video.srcObject = null;
  stopStats();
  quality.textContent = "—";
  fps.textContent = "—";
  routeEl.textContent = "—";
  zoomRange.disabled = true;
  closeViewerCalls();
}

/* Если эфирная камера пропала — ждём её возврата 45 секунд, потом снимаем её с эфира. */
function startGrace() {
  clearTimeout(graceTimer);
  const cid = liveCid;
  graceTimer = setTimeout(() => {
    if (liveCid === cid && !activeStream) {
      stopLive();
      toast("Камера не вернулась — эфир остановлен");
    }
  }, 45000);
}

/* ---------- QR ---------- */

function renderQR() {
  const url = new URL("./index.html", window.location.href);
  url.search = "";
  url.hash = "";
  url.searchParams.set("room", room);
  url.searchParams.set("k", roomToken);

  qrEl.innerHTML = "";
  if (typeof QRCode === "undefined") {
    qrEl.textContent = "QR недоступен";
  } else {
    try {
      new QRCode(qrEl, {
        text: url.href,
        width: 320,
        height: 320,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });
    } catch (error) {
      console.error("QR error:", error);
      qrEl.textContent = "QR недоступен";
    }
  }
  qrLink.textContent = url.host + url.pathname;

  const host = url.hostname;
  const local = host === "localhost" || host === "127.0.0.1" || host === "[::1]" || url.protocol === "file:";
  qrWarn.hidden = !local;
  if (local) qrWarn.textContent = "QR ведёт на localhost — телефон его не откроет. Откройте монитор по HTTPS-адресу (например GitHub Pages).";
}

/* ---------- Комната ---------- */

function destroyPeer() {
  clearTimeout(reconnectTimer);
  peerOpen = false;
  if (peer) { const p = peer; peer = null; try { p.destroy(); } catch {} }
  teardownMedia();
  viewerConns.clear();
}

function scheduleReconnect() {
  clearTimeout(reconnectTimer);
  failCount++;
  const delay = Math.min(1000 * failCount, 8000);
  reconnectTimer = setTimeout(() => {
    if (!peer || peer.destroyed) { createRoom(room); return; }
    if (peer.disconnected) {
      try { peer.reconnect(); } catch { createRoom(room); }
    }
  }, delay);
}

function createRoom(keepCode) {
  destroyPeer();
  room = keepCode || generateRoomCode();
  if (!keepCode || !roomToken) roomToken = GLAZOK.randomId(12);
  if (!keepCode) {
    approved.clear();
    cams.clear();
    liveCid = null;
    selectedCid = null;
    refreshAll();
  }
  roomCode.textContent = room;
  renderQR();
  setConnection("Создание комнаты...", "");

  const p = new Peer("glz-" + room.toLowerCase(), GLAZOK.peerOptions());
  peer = p;

  p.on("open", () => {
    if (peer !== p) return;
    failCount = 0;
    peerOpen = true;
    refreshAll();
  });

  p.on("connection", conn => {
    if (peer !== p) return;
    const md = conn.metadata || {};
    if (md.cid) handleCameraConn(conn, md); else handleViewerConn(conn);
  });

  p.on("call", handleIncoming);

  p.on("error", error => {
    if (peer !== p) return;
    if (error.type === "peer-unavailable") {
      const m = /(glz-view-\w+)/.exec(error.message || "");
      if (m) { viewers.delete(m[1]); viewerCalls.delete(m[1]); viewerConns.delete(m[1]); }
      return;
    }
    console.error("PeerJS error:", error);
    if (error.type === "unavailable-id") {
      createRoom();
    } else if (["network", "server-error", "socket-error", "socket-closed"].includes(error.type)) {
      peerOpen = false;
      setConnection("Нет связи с сервером…", "");
      scheduleReconnect();
    } else {
      setConnection("Ошибка: " + error.type, "");
    }
  });

  p.on("disconnected", () => {
    if (peer !== p) return;
    peerOpen = false;
    setConnection("Соединение потеряно — переподключение…", "");
    scheduleReconnect();
  });
}

/* ---------- Камеры (каналы управления) ---------- */

function whenOpen(conn, fn) {
  if (conn.open) fn(); else conn.once("open", fn);
}

function handleCameraConn(conn, md) {
  const cid = md.cid;
  const trusted = approved.has(cid) || (md.token && md.token === roomToken);

  if (trusted) {
    approved.add(cid);
    registerCamera(conn, md);
  } else {
    askApproval(conn, md);   // в список камера попадёт только после «Разрешить»
  }

  conn.on("data", data => {
    if (!data || typeof data !== "object" || !approved.has(cid)) return;

    let cam = cams.get(cid);
    if (!cam) {                      // камеру убрали как «молчащую», а она жива — возвращаем
      cam = registerCamera(conn, md);
    } else if (cam.conn !== conn) {
      return;                        // сообщение от старого соединения (телефон обновил страницу)
    }
    cam.lastSeen = Date.now();

    switch (data.type) {
      case "status":
      case "battery-update":         // старое имя сообщения
        if (typeof data.model === "string" && data.model) cam.model = data.model;
        if (typeof data.name === "string") cam.name = data.name;
        if (typeof data.battery === "number") cam.battery = data.battery;
        else if (typeof data.level === "number") cam.battery = data.level;
        if (data.hasBattery === false) cam.hasBattery = false;
        else if (typeof cam.battery === "number") cam.hasBattery = true;
        cam.charging = !!data.charging;
        refreshAll();
        break;
      case "caps":
        cam.zoomCaps = data.zoom && typeof data.zoom.min === "number" ? data.zoom : null;
        if (cid === liveCid) applyCaps();
        break;
      case "zoom-value":
        if (cam.zoomCaps && typeof data.value === "number") {
          cam.zoomCaps.value = data.value;
          if (cid === liveCid) syncZoomUI();
        }
        break;
      case "zoom-failed":            // оптический зум не сработал — переходим на цифровой
        cam.zoomCaps = null;
        if (cid === liveCid) { applyCaps(); toast("Оптический зум недоступен — цифровое увеличение"); }
        break;
      case "bye":
        removeCam(cid, conn);
        break;
    }
  });

  const gone = () => {
    if (pending && pending.conn === conn) hideApproval();
    removeCam(cid, conn);
  };
  conn.on("close", gone);
  conn.on("error", gone);
}

/* Одна запись на телефон. Повторное подключение того же телефона заменяет старое — дублей нет. */
function registerCamera(conn, md) {
  const cid = md.cid;
  let cam = cams.get(cid);

  if (cam && cam.conn !== conn) {
    const old = cam.conn;
    cam.conn = conn;
    try { old.close(); } catch {}
  }

  if (!cam) {
    if (!indexByCid.has(cid)) indexByCid.set(cid, indexByCid.size + 1);
    cam = {
      cid, conn,
      index: indexByCid.get(cid),
      model: "", name: "",
      customLabel: loadNames()[cid] || "",
      battery: null, charging: false, hasBattery: null,
      zoomCaps: null,
      lastSeen: Date.now()
    };
    cams.set(cid, cam);
  }
  if (typeof md.model === "string" && md.model) cam.model = md.model;
  if (typeof md.name === "string") cam.name = md.name;
  cam.lastSeen = Date.now();

  if (!selectedCid || !cams.has(selectedCid)) selectedCid = cid;

  whenOpen(conn, () => {
    if (cam.conn !== conn) return;
    sendTo(cam, { type: "need-caps" });
    // телефон, который уже был в эфире, вернулся после обрыва — продолжаем эфир
    if (liveCid === cid) { clearTimeout(graceTimer); sendTo(cam, { type: "go-live" }); }
  });

  refreshAll();
  return cam;
}

function removeCam(cid, conn) {
  const cam = cams.get(cid);
  if (!cam || (conn && cam.conn !== conn)) return;   // закрылось старое соединение — запись не трогаем
  cams.delete(cid);
  if (selectedCid === cid) selectedCid = liveCid && cams.has(liveCid) ? liveCid : (cams.keys().next().value || null);
  if (liveCid === cid) {
    teardownMedia();
    applyCaps();
    startGrace();
    toast("Камера в эфире отключилась — ждём возврата");
  }
  refreshAll();
}

/* Убираем «молчащие» камеры: закрытие страницы не всегда сообщает о себе сразу. */
setInterval(() => {
  const now = Date.now();
  Array.from(cams.values()).forEach(cam => {
    if (cam.cid === liveCid && activeStream) return;     // видео идёт — камера жива
    const silent = now - cam.lastSeen;
    if (silent > 30000 || (!cam.conn.open && silent > 10000)) removeCam(cam.cid);
  });
}, 5000);

/* ---------- Подтверждение камеры, подключившейся по коду ---------- */

function askApproval(conn, md) {
  if (pending && pending.conn !== conn) { try { pending.conn.close(); } catch {} }
  pending = { conn, md };
  const name = md.name || md.model || ("«" + String(md.cid).slice(0, 4) + "»");
  approveText.textContent = "Телефон " + name + " хочет подключиться по коду комнаты";
  approveBox.hidden = false;
}

function hideApproval() {
  pending = null;
  approveBox.hidden = true;
}

$("approve-yes").addEventListener("click", () => {
  const p = pending;
  if (!p) return;
  hideApproval();
  approved.add(p.md.cid);
  registerCamera(p.conn, p.md);
});

$("approve-no").addEventListener("click", () => {
  const p = pending;
  hideApproval();
  if (!p) return;
  try { p.conn.send({ type: "denied" }); } catch {}
  setTimeout(() => { try { p.conn.close(); } catch {} }, 300);
});

/* ---------- Входящее видео ---------- */

/* Принимаем видео только от телефона, которому мы сами дали «go-live». Остальные отклоняем. */
function handleIncoming(incoming) {
  const cid = incoming.metadata && incoming.metadata.cid;
  const cam = cid ? cams.get(cid) : null;
  if (!cam || cid !== liveCid) {
    try { incoming.close(); } catch {}
    if (cam) sendTo(cam, { type: "go-idle" });    // чтобы телефон не пытался дозвониться снова
    return;
  }
  acceptCall(incoming, cid);
}

function acceptCall(incoming, cid) {
  if (cameraCall && cameraCall !== incoming) {
    const old = cameraCall;
    cameraCall = null;
    try { old.close(); } catch {}
  }
  cameraCall = incoming;
  incoming.answer(undefined, { sdpTransform: GLAZOK.sdpHighBitrate(35000, 4000, 800) });

  incoming.on("stream", stream => {
    if (cameraCall !== incoming || liveCid !== cid) return;
    clearTimeout(graceTimer);
    GLAZOK.tuneReceivers(incoming.peerConnection);
    activeStream = stream;
    video.srcObject = stream;
    video.play().catch(() => {});
    startStats(incoming);
    updateVideoInfo();
    zoomRange.disabled = false;
    viewers.forEach(callViewer);      // Clean Output получает новый поток (в том числе после переключения)
    refreshAll();
  });

  incoming.on("close", () => {
    if (cameraCall !== incoming) return;
    cameraCall = null;
    activeStream = null;
    video.srcObject = null;
    stopStats();
    quality.textContent = "—";
    fps.textContent = "—";
    routeEl.textContent = "—";
    zoomRange.disabled = true;
    closeViewerCalls();
    if (liveCid === cid) startGrace();   // телефон сам попробует дозвониться снова
    refreshAll();
  });

  incoming.on("error", error => {
    console.error("Call error:", error);
    if (cameraCall !== incoming) return;
    overlay.classList.remove("hidden");
    overlay.textContent = "Ошибка видеосоединения";
  });
}

/* ---------- Clean Output (зрители) ---------- */

function handleViewerConn(conn) {
  let viewerId = null;
  conn.on("data", data => {
    if (!data || data.type !== "clean-view" || !data.viewerId) return;
    if (data.token !== roomToken) {
      try { conn.send({ type: "denied" }); } catch {}
      return;
    }
    viewerId = data.viewerId;
    viewers.add(viewerId);
    viewerConns.set(viewerId, conn);
    callViewer(viewerId);
    if (lastViewMsg) { try { conn.send(lastViewMsg); } catch {} }
  });
  conn.on("close", () => { if (viewerId && viewerConns.get(viewerId) === conn) viewerConns.delete(viewerId); });
}

function callViewer(viewerId) {
  if (!peer || !activeStream) return;
  const old = viewerCalls.get(viewerId);
  if (old) { try { old.close(); } catch {} }
  const call = peer.call(viewerId, activeStream);
  if (!call) return;
  viewerCalls.set(viewerId, call);
  GLAZOK.boostCall(call, GLAZOK.VIEWER_BITRATE);
  call.on("close", () => { if (viewerCalls.get(viewerId) === call) viewerCalls.delete(viewerId); });
}

/* ---------- Статистика приёма ---------- */

function startStats(call) {
  stopStats();
  prevBytes = null;
  statsTimer = setInterval(async () => {
    const pc = call.peerConnection;
    if (!pc || cameraCall !== call) return;
    try {
      const reports = await pc.getStats();
      reports.forEach(r => {
        if (r.type === "inbound-rtp" && r.kind === "video") {
          if (typeof r.framesPerSecond === "number") fps.textContent = Math.round(r.framesPerSecond);
          if (prevBytes !== null) {
            const kbps = (r.bytesReceived - prevBytes.bytes) * 8 / ((r.timestamp - prevBytes.ts) / 1000) / 1000;
            if (isFinite(kbps) && kbps >= 0) updateVideoInfo(kbps >= 1000 ? (kbps / 1000).toFixed(1) + " Mbps" : Math.round(kbps) + " Kbps");
          }
          prevBytes = { bytes: r.bytesReceived, ts: r.timestamp };
        }
      });
      const route = await GLAZOK.routeType(pc);
      if (route && cameraCall === call) routeEl.textContent = GLAZOK.routeLabel(route);
    } catch {}
  }, 2000);
}

function stopStats() {
  if (statsTimer) { clearInterval(statsTimer); statsTimer = null; }
}

function fitBox() {
  const w = video.videoWidth;
  const h = video.videoHeight;
  if (!w || !h) return;
  videoBox.style.aspectRatio = w + " / " + h;
  if (w >= h) {
    videoBox.style.width = "100%";
    videoBox.style.height = "auto";
  } else {
    videoBox.style.width = "auto";
    videoBox.style.height = "62vh";
    videoBox.style.margin = "0 auto";
  }
  clampPan();
  applyTransform();
}

function updateVideoInfo(bitrateText) {
  const w = video.videoWidth;
  const h = video.videoHeight;
  if (!w || !h) return;
  fitBox();
  quality.textContent = `${w}×${h}` + (bitrateText ? ` • ${bitrateText}` : "");
}
video.addEventListener("resize", () => updateVideoInfo());
video.addEventListener("loadedmetadata", () => updateVideoInfo());

/* ---------- Зум ---------- */

/*
 * Оптический зум: монитор шлёт телефону {type:"zoom", value} по каналу управления
 * ЭФИРНОГО телефона, телефон применяет его к камере и возвращает фактическое значение.
 * Если у камеры нет оптического зума (или он не сработал) — цифровое увеличение:
 * кадр масштабируется на мониторе и то же самое передаётся в Clean Output (view-transform).
 */

const digital = { scale: 1, x: 0, y: 0 };

function liveCam() { return liveCid ? cams.get(liveCid) || null : null; }
function currentCaps() { const cam = liveCam(); return cam && cam.zoomCaps ? cam.zoomCaps : null; }

function sendCtrl(message) {
  sendTo(liveCam(), message);
}

let zoomSendTimer = null;
let zoomPendingValue = null;
function sendZoomThrottled(value) {
  zoomPendingValue = value;
  if (zoomSendTimer) return;
  zoomSendTimer = setTimeout(() => {
    zoomSendTimer = null;
    sendCtrl({ type: "zoom", value: zoomPendingValue });
  }, 40);
}

function broadcastView() {
  const r = videoBox.getBoundingClientRect();
  lastViewMsg = {
    type: "view-transform",
    scale: digital.scale,
    x: r.width ? digital.x / r.width : 0,
    y: r.height ? digital.y / r.height : 0
  };
  viewerConns.forEach(conn => { if (conn.open) { try { conn.send(lastViewMsg); } catch {} } });
}

function applyTransform() {
  video.style.transform = `translate(${digital.x}px, ${digital.y}px) scale(${digital.scale})`;
  broadcastView();
}

function clampPan() {
  const r = videoBox.getBoundingClientRect();
  const maxX = (digital.scale - 1) * r.width / 2;
  const maxY = (digital.scale - 1) * r.height / 2;
  digital.x = clamp(digital.x, -maxX, maxX);
  digital.y = clamp(digital.y, -maxY, maxY);
}

function setDigital(scale) {
  digital.scale = clamp(scale, 1, 4);
  if (digital.scale === 1) { digital.x = 0; digital.y = 0; }
  clampPan();
  applyTransform();
}

function syncZoomUI() {
  const caps = currentCaps();
  const value = caps ? caps.value : digital.scale;
  zoomRange.value = value;
  zoomValue.textContent = Number(value).toFixed(1) + "×";
}

/* Вызывается при смене камеры в эфире, при получении её возможностей и при отказе оптики. */
function applyCaps() {
  const caps = currentCaps();
  setDigital(1);
  if (caps) {
    zoomRange.min = caps.min;
    zoomRange.max = caps.max;
    zoomRange.step = caps.step || 0.1;
    zoomMode.textContent = "Оптический зум камеры";
  } else {
    zoomRange.min = 1;
    zoomRange.max = 4;
    zoomRange.step = 0.05;
    zoomMode.textContent = liveCid ? "Цифровой зум" : "Зум";
  }
  zoomRange.disabled = !activeStream;
  syncZoomUI();
}

function setZoomValue(value) {
  const caps = currentCaps();
  if (caps) {
    caps.value = clamp(value, caps.min, caps.max);
    sendZoomThrottled(caps.value);
  } else {
    setDigital(value);
  }
  syncZoomUI();
}

zoomRange.addEventListener("input", () => setZoomValue(Number(zoomRange.value)));
zoomReset.addEventListener("click", () => { const caps = currentCaps(); setZoomValue(caps ? caps.min : 1); });
videoBox.addEventListener("dblclick", () => { const caps = currentCaps(); setZoomValue(caps ? caps.min : 1); });

videoBox.addEventListener("wheel", e => {
  if (!activeStream) return;
  e.preventDefault();
  const caps = currentCaps();
  const current = caps ? caps.value : digital.scale;
  setZoomValue(current * (e.deltaY < 0 ? 1.1 : 1 / 1.1));
}, { passive: false });

let drag = null;
videoBox.addEventListener("pointerdown", e => {
  if (currentCaps() || digital.scale <= 1) return;
  drag = { x: e.clientX, y: e.clientY, ox: digital.x, oy: digital.y };
  videoBox.setPointerCapture(e.pointerId);
});
videoBox.addEventListener("pointermove", e => {
  if (!drag) return;
  digital.x = drag.ox + (e.clientX - drag.x);
  digital.y = drag.oy + (e.clientY - drag.y);
  clampPan();
  applyTransform();
});
videoBox.addEventListener("pointerup", () => { drag = null; });
videoBox.addEventListener("pointercancel", () => { drag = null; });

/* ---------- TURN ---------- */

function showTurnStatus(text, kind) {
  turnStatus.textContent = text;
  turnStatus.className = "turn-status" + (kind ? " " + kind : "");
}

async function runTurnCheck() {
  turnBtn.disabled = true;
  showTurnStatus("TURN: проверка…", "");
  const r = await GLAZOK.testTurn();
  turnBtn.disabled = false;
  const relayMode = GLAZOK.forceRelay ? " Включён режим ?relay=1: всё идёт только через TURN." : "";
  if (r.relay > 0) {
    showTurnStatus("✅ TURN работает (источник: " + r.source + ", relay-кандидатов: " + r.relay + ", " + r.ms + " мс). Видео пройдёт и в одной Wi‑Fi сети, и между разными сетями." + relayMode, "ok");
  } else if (r.source === "stun-only") {
    showTurnStatus("⚠ TURN не подключён: " + (r.error || "нет данных") + ". В одной Wi‑Fi сети всё будет работать, между разными сетями (мобильный интернет ↔ Wi‑Fi) видео может не пройти.", "warn");
  } else {
    showTurnStatus("⚠ TURN получен (" + r.source + "), но relay-кандидатов нет: проверьте, что учётные данные Metered не отозваны и не истекли." + (r.error ? " " + r.error : ""), "warn");
  }
}

turnBtn.addEventListener("click", runTurnCheck);

/* ---------- Кнопки ---------- */

async function copyRoom() {
  try {
    await navigator.clipboard.writeText(room);
    copyBtn.textContent = "Скопировано";
    setTimeout(() => { copyBtn.textContent = "Скопировать код"; }, 1500);
  } catch {
    console.log("Room:", room);
  }
}

function openCleanOutput() {
  const url = new URL("./view.html", window.location.href);
  url.searchParams.set("room", room);
  url.searchParams.set("k", roomToken);
  if (GLAZOK.forceRelay) url.searchParams.set("relay", "1");
  window.open(url.href, "_blank");
}

copyBtn.addEventListener("click", copyRoom);
cleanBtn.addEventListener("click", openCleanOutput);
roomCode.addEventListener("click", copyRoom);

window.addEventListener("online", () => { if (peer && peer.disconnected) { failCount = 0; scheduleReconnect(); } });

window.addEventListener("beforeunload", () => {
  stopStats();
  destroyPeer();
});

applyCaps();
refreshAll();
GLAZOK.initIce().then(() => {
  createRoom();
  runTurnCheck();
});

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("./sw.js").catch(() => {});
}

// Автоматический счётчик версий (начинает с v10 и добавляет +1 при каждом обновлении)
(function initVersion() {
  const versionEl = document.getElementById("app-version");
  if (!versionEl) return;

  // Получаем сохранённую версию или ставим начальную (10)
  let currentVersion = parseInt(localStorage.getItem("glazok_version"), 10);

  if (isNaN(currentVersion)) {
    currentVersion = 10; // Стартовая версия v10
  } else {
    currentVersion += 1; // Добавляем +1 при каждом перезапуске/обновлении
  }

  // Сохраняем новое значение
  localStorage.setItem("glazok_version", currentVersion);

  // Выводим в футер
  versionEl.textContent = `Glazok v${currentVersion}`;
})();

</script>
</body>
</html>
